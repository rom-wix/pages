document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tle }}<\u002Fh1>\n                    <div style=\"font-size:14px;color:#5b6478;margin-top:8px;max-width:600px;line-height:1.5\">{{ obSub }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"text-align:right;flex:0 0 auto\">\n                    <div style=\"font-size:12.5px;color:#868aa5;font-weight:600\">Step {{ obStepNum }} of 5<\u002Fdiv>\n                    <div style=\"width:170px;height:5px;border-radius:3px;background:#e2e6ed;margin-top:8px;overflow:hidden\"><i style=\"display:block;height:100%;border-radius:3px;background:{{ accent }};width:{{ obPct }};transition:width .25s\"><\u002Fi><\u002Fdiv>\n                    <sc-if value=\"{{ obBeforePass }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span sc-camel-on-click=\"{{ obExit }}\" style=\"display:inline-block;font-size:12.5px;font-weight:600;color:{{ accent }};cursor:pointer;margin-top:10px\">Finish later<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n\n                <div style=\"display:flex;gap:24px;align-items:flex-start;margin-top:24px\">\n                  <div style=\"width:236px;flex:0 0 236px;display:flex;flex-direction:column;gap:2px\">\n                    <sc-for list=\"{{ obRail }}\" as=\"r\" hint-placeholder-count=\"5\">\n                      <div sc-camel-on-click=\"{{ r.go }}\" style=\"display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:9px;cursor:pointer\" style-hover=\"background:#eceff4\">\n                        <span style=\"width:24px;height:24px;border-radius:50%;flex:0 0 24px;display:grid;place-items:center;font-size:11.5px;font-weight:800;border:1px solid {{ r.numBorder }};background:{{ r.numBg }};color:{{ r.numFg }}\">{{ r.n }}<\u002Fspan>\n                        <span style=\"font-size:13.5px;line-height:1.35;color:{{ r.fg }};font-weight:{{ r.wt }}\">{{ r.title }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n\n                  <div style=\"flex:1;min-width:0;background:#fff;border:1px solid #e6e8ec;border-radius:14px;overflow:hidden\">\n\n                    <!-- step 1 · door -->\n                    <sc-if value=\"{{ obIs.door }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"padding:24px 26px\">\n                      <div style=\"font-size:13px;font-weight:700;margin-bottom:8px\">Door name<\u002Fdiv>\n                      <input value=\"{{ obDoorName }}\" sc-camel-on-input=\"{{ onObDoorName }}\" style=\"width:100%;height:42px;border:1px solid #c5cad3;border-radius:8px;padding:0 13px;font-size:14px;font-family:inherit;color:#16213A;outline:none\">\n                      <div style=\"font-size:12.5px;color:#868aa5;margin-top:7px\">Staff see this name every time they scan, so use what they call it out loud.<\u002Fdiv>\n\n                      <div style=\"font-size:13px;font-weight:700;margin:22px 0 10px\">Where is it<\u002Fdiv>\n                      <div style=\"display:flex;gap:10px\">\n                        <sc-for list=\"{{ obLocRows }}\" as=\"l\" hint-placeholder-count=\"2\">\n                          <div sc-camel-on-click=\"{{ l.go }}\" style=\"flex:1;display:flex;align-items:center;gap:10px;border:1px solid {{ l.border }};background:{{ l.bg }};border-radius:10px;padding:13px 14px;cursor:pointer\">\n                            <span style=\"width:17px;height:17px;border-radius:50%;border:1.5px solid {{ l.dotB }};flex:0 0 17px;display:grid;place-items:center\"><i style=\"width:9px;height:9px;border-radius:50%;background:{{ l.dotBg }};display:block\"><\u002Fi><\u002Fspan>\n                            <span style=\"font-size:13.5px;font-weight:600\">{{ l.name }}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n\n                    <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <!-- step 2 · hardware -->\n                    <sc-if value=\"{{ obIs.hardware }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"padding:24px 26px\">\n                      <div style=\"display:flex;flex-direction:column;gap:9px\">\n                        <sc-for list=\"{{ hwCards }}\" as=\"h\" hint-placeholder-count=\"3\">\n                          <div sc-camel-on-click=\"{{ h.go }}\" style=\"display:flex;align-items:flex-start;gap:11px;border:1px solid {{ h.border }};background:{{ h.bg }};border-radius:10px;padding:14px 15px;cursor:pointer\">\n                            <span style=\"width:17px;height:17px;border-radius:50%;border:1.5px solid {{ h.dotB }};flex:0 0 17px;margin-top:2px;display:grid;place-items:center\"><i style=\"width:9px;height:9px;border-radius:50%;background:{{ h.dotBg }};display:block\"><\u002Fi><\u002Fspan>\n                            <span style=\"flex:1;min-width:0\">\n                              <span style=\"display:flex;align-items:center;gap:9px\"><span style=\"font-size:13.5px;font-weight:700\">{{ h.title }}<\u002Fspan><span style=\"font-size:10.5px;font-weight:700;color:#5b6478;background:#EEF1F6;border-radius:5px;padding:2px 7px\">{{ h.tag }}<\u002Fspan><\u002Fspan>\n                              <span style=\"display:block;font-size:12.5px;color:#5b6478;margin-top:4px;line-height:1.5\">{{ h.desc }}<\u002Fspan>\n                            <\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n\n                      <sc-if value=\"{{ hwIsReader }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"margin-top:20px;border-top:1px solid #eef0f3;padding-top:18px\">\n                        <sc-if value=\"{{ notPaired }}\" hint-placeholder-val=\"{{ true }}\">\n                        <div style=\"display:flex;gap:16px;align-items:center;background:#FBFCFD;border:1px solid #e6e8ec;border-radius:12px;padding:18px\">\n                          <span style=\"width:46px;height:46px;border-radius:11px;background:#fff;border:1px solid #e6e8ec;display:grid;place-items:center;color:#595d70;flex:0 0 46px\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"3\" width=\"14\" height=\"18\" rx=\"3\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"2.5\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n                          <div style=\"flex:1;min-width:0\">\n                            <div style=\"font-size:13.5px;font-weight:700\">Enter this code on your reader<\u002Fdiv>\n                            <div style=\"font-family:'Wix Madefor Display';font-size:24px;font-weight:800;letter-spacing:.06em;margin-top:4px\">{{ pairCode }}<\u002Fdiv>\n                            <div style=\"font-size:12.5px;color:#868aa5;margin-top:5px\">Kisi, Salto and Brivo readers accept this from their admin app. Nothing at the door changes for your clients.<\u002Fdiv>\n                          <\u002Fdiv>\n                          <button sc-camel-on-click=\"{{ pairNow }}\" style=\"height:38px;padding:0 16px;border-radius:19px;border:1px solid #c5cad3;background:#fff;color:#16213A;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;flex:0 0 auto\">Simulate pairing<\u002Fbutton>\n                        <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ paired }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"display:flex;gap:14px;align-items:center;background:#F1FAF5;border:1px solid #b9e2cb;border-radius:12px;padding:16px 18px\">\n                          <span style=\"width:34px;height:34px;border-radius:50%;background:#1F9D5B;display:grid;place-items:center;color:#fff;flex:0 0 34px\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"19\" height=\"19\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                          <div><div style=\"font-size:13.5px;font-weight:700;color:#0F5C3A\">Kisi reader K-2 is paired<\u002Fdiv><div style=\"font-size:12.5px;color:#3B4257;margin-top:3px\">From now on the reader asks Arrivals before it unlocks, and every entry lands in your log.<\u002Fdiv><\u002Fdiv>\n                        <\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                      <\u002Fsc-if>\n\n                      <sc-if value=\"{{ hwIsBuy }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"margin-top:20px;border-top:1px solid #eef0f3;padding-top:18px\">\n                        <div style=\"font-size:13px;font-weight:700\">Hardware comes from a local distributor<\u002Fdiv>\n                        <div style=\"font-size:12.5px;color:#5b6478;margin-top:6px;line-height:1.5\">Readers are supplied and fitted by certified Kisi, Salto and Brivo partners — find the ones working near {{ obLoc }} and they quote and install for you. Until it is on the wall your front desk scans passes from their phone, and the record is identical.<\u002Fdiv>\n                        <button sc-camel-on-click=\"{{ toast_distributor }}\" style=\"display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 18px;border-radius:20px;border:1px solid #c5cad3;background:#fff;color:#16213A;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:14px\">Find a distributor near you<svg sc-camel-view-box=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 4h6v6M20 4l-8.5 8.5\"><\u002Fpath><path d=\"M18 14.5V19a1.5 1.5 0 01-1.5 1.5h-11A1.5 1.5 0 014 19V8a1.5 1.5 0 011.5-1.5H10\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                      <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <!-- step 3 · plans -->\n                    <sc-if value=\"{{ obIs.plans }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"padding:24px 26px\">\n                      <sc-if value=\"{{ obPlanNone }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"display:flex;gap:12px;align-items:flex-start;background:#FFF8E8;border:1px solid #f2ddac;border-radius:12px;padding:14px 16px;margin-bottom:16px\">\n                        <span style=\"width:24px;height:24px;border-radius:50%;background:#E8951C;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;flex:0 0 24px\">!<\u002Fspan>\n                        <div style=\"font-size:13px;color:#5A3A00;line-height:1.5\"><b>Nothing opens this door yet.<\u002Fb> With no plan connected, every scan at {{ obDoorName }} is denied — including your own members. Switch on at least one.<\u002Fdiv>\n                      <\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-for list=\"{{ obPlans }}\" as=\"p\" hint-placeholder-count=\"4\">\n                        <div style=\"display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #f1f2f5\">\n                          <div style=\"flex:1;min-width:0\"><div style=\"font-size:14px;font-weight:700\">{{ p.name }}<\u002Fdiv><div style=\"font-size:12.5px;color:#868aa5;margin-top:2px\">{{ p.meta }} · {{ p.subs }}<\u002Fdiv><\u002Fdiv>\n                          <span sc-camel-on-click=\"{{ p.go }}\" style=\"width:40px;height:24px;border-radius:12px;position:relative;flex:0 0 40px;cursor:pointer;background:{{ p.bg }};transition:background .15s\"><i style=\"position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;left:{{ p.x }}\"><\u002Fi><\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                      <div style=\"font-size:12.5px;color:#868aa5;margin-top:14px;line-height:1.5\">Later you can set each plan up in more detail — count entries like a punch card, limit it to certain days and hours, and connect it to more than one door.<\u002Fdiv>\n                    <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <!-- step 4 · forms -->\n                    <sc-if value=\"{{ obIs.forms }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"padding:24px 26px\">\n                      <sc-for list=\"{{ obForms }}\" as=\"f\" hint-placeholder-count=\"3\">\n                        <div style=\"display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #f1f2f5\">\n                          <div style=\"flex:1;min-width:0\"><div style=\"font-size:14px;font-weight:700\">{{ f.name }}<\u002Fdiv><div style=\"font-size:12.5px;color:#868aa5;margin-top:2px\">{{ f.meta }}<\u002Fdiv><\u002Fdiv>\n                          <span sc-camel-on-click=\"{{ f.go }}\" style=\"width:40px;height:24px;border-radius:12px;position:relative;flex:0 0 40px;cursor:pointer;background:{{ f.bg }};transition:background .15s\"><i style=\"position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;left:{{ f.x }}\"><\u002Fi><\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                      <div style=\"margin-top:20px\">\n                        <div style=\"font-size:13px;font-weight:700\">If a form is missing at the door<\u002Fdiv>\n                        <div style=\"font-size:12.5px;color:#868aa5;margin-top:5px;margin-bottom:11px\">Most studios warn rather than block — a blocked client at 6am becomes a phone call to you.<\u002Fdiv>\n                        <span style=\"display:inline-flex;border:1px solid #d5dae2;border-radius:8px;overflow:hidden\">\n                          <span sc-camel-on-click=\"{{ setMissFlag }}\" style=\"cursor:pointer;font-size:13px;font-weight:600;padding:9px 15px;background:{{ missSegFlag.bg }};color:{{ missSegFlag.fg }}\">Let them in, flag it<\u002Fspan>\n                          <span sc-camel-on-click=\"{{ setMissBlock }}\" style=\"cursor:pointer;font-size:13px;font-weight:600;padding:9px 15px;border-left:1px solid #d5dae2;background:{{ missSegBlock.bg }};color:{{ missSegBlock.fg }}\">Block until signed<\u002Fspan>\n                        <\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <!-- step 5 · pass -->\n                    <sc-if value=\"{{ obIs.pass }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"padding:24px 26px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap\">\n                      <div style=\"flex:1 1 320px;min-width:300px\">\n                        <sc-for list=\"{{ obPassRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                          <div style=\"display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid #f1f2f5\">\n                            <div style=\"flex:1;min-width:0\"><div style=\"font-size:13.5px;font-weight:700\">{{ r.name }}<\u002Fdiv><div style=\"font-size:12.5px;color:#868aa5;margin-top:3px;line-height:1.45\">{{ r.desc }}<\u002Fdiv><\u002Fdiv>\n                            <span sc-camel-on-click=\"{{ r.go }}\" style=\"width:40px;height:24px;border-radius:12px;position:relative;flex:0 0 40px;cursor:pointer;margin-top:2px;background:{{ r.bg }};transition:background .15s\"><i style=\"position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;left:{{ r.x }}\"><\u002Fi><\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                        <div style=\"font-size:12.5px;color:#868aa5;margin-top:14px;line-height:1.5\">Colours, logo and what the pass shows can be changed any time in Setup.<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"width:250px;flex:0 0 250px;background:#eaf0fb;border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;align-items:center\">\n                        <div style=\"font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#5b6478;margin-bottom:12px\">Member's pass<\u002Fdiv>\n                        <div style=\"width:206px;background:#fff;border-radius:16px;box-shadow:0 8px 22px rgba(11,17,40,.12);overflow:hidden\">\n                          <div style=\"background:{{ passBrand }};color:{{ passTextColor }};padding:13px 16px;display:flex;align-items:center;justify-content:space-between\"><span style=\"font-size:12px;font-weight:700;letter-spacing:.03em\">{{ passBizNameUpper }}<\u002Fspan><span style=\"font-size:10px;font-weight:700;background:rgba(255,255,255,.22);padding:3px 8px;border-radius:10px\">ACTIVE<\u002Fspan><\u002Fdiv>\n                          <div style=\"padding:16px;text-align:center\">\n                            <div style=\"font-size:15px;font-weight:800;font-family:'Wix Madefor Display'\">Jordan Reyes<\u002Fdiv>\n                            <div style=\"font-size:11.5px;color:#5b6478;margin-top:2px\">10-class pack<\u002Fdiv>\n                            <div style=\"margin:14px 0 6px;padding:10px;border-radius:10px;background:#F7F8FA\"><div style=\"font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#868aa5\">Sessions remaining<\u002Fdiv><div style=\"font-size:30px;font-weight:800;font-family:'Wix Madefor Display';color:{{ passBrand }};line-height:1.1;margin-top:2px\">3<\u002Fdiv><\u002Fdiv>\n                            <div style=\"font-size:11.5px;color:#868aa5;margin-top:12px\">Present at the door<\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"display:flex;gap:6px;justify-content:center;margin-top:12px\"><span style=\"display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:5px;background:#111;color:#fff;font-size:10px;font-weight:600\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"11\" height=\"11\" fill=\"currentColor\"><path d=\"M16.4 12.6c0-2 1.6-3 1.7-3-.9-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7s-1.6-.7-2.6-.7c-1.3 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 8 .7 1 1.4 2 2.4 2 1 0 1.3-.6 2.5-.6s1.5.6 2.5.6 1.7-1 2.3-2c.7-1 1-2 1-2.1 0 0-1.9-.7-1.9-2.9zM14.7 6c.5-.7.9-1.6.8-2.5-.8 0-1.7.5-2.3 1.2-.5.6-.9 1.5-.8 2.4.9.1 1.8-.4 2.3-1.1z\"><\u002Fpath><\u002Fsvg>Apple<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:5px;background:#fff;border:1px solid #dadce0;color:#3c4043;font-size:10px;font-weight:600\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"#4285F4\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"6\" width=\"18\" height=\"12\" rx=\"2\"><\u002Frect><path d=\"M3 10h18\"><\u002Fpath><\u002Fsvg>Google<\u002Fspan><\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <sc-if value=\"{{ hwShowFallback }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;gap:11px;align-items:flex-start;padding:14px 26px;border-top:1px solid #eef0f3;background:#F5F8FF\">\n                      <span style=\"width:22px;height:22px;border-radius:6px;background:#fff;display:grid;place-items:center;color:{{ accent }};flex:0 0 22px;margin-top:1px\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 8v.01M11 12h1v5h1\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n                      <div style=\"font-size:12.5px;color:#3B4257;line-height:1.5\">You can carry on and finish setting up the hardware later — until it is connected, your front desk scans passes from the Wix Owner app.<\u002Fdiv>\n                    <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <div style=\"display:flex;align-items:center;gap:12px;padding:16px 26px;border-top:1px solid #eef0f3;background:#FBFCFD\">\n                      <sc-if value=\"{{ obCanBack }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button sc-camel-on-click=\"{{ obBack }}\" style=\"height:40px;padding:0 18px;border-radius:20px;border:1px solid #c5cad3;background:#fff;color:#16213A;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit\">Back<\u002Fbutton>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ obBeforePass }}\" hint-placeholder-val=\"{{ true }}\">\n                      <button sc-camel-on-click=\"{{ obNext }}\" style=\"height:40px;padding:0 22px;border-radius:20px;border:none;background:{{ accent }};color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit\">Continue<\u002Fbutton>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ obIs.pass }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button sc-camel-on-click=\"{{ obSkip }}\" style=\"height:40px;padding:0 22px;border-radius:20px;border:none;background:{{ accent }};color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit\">Finish setup<\u002Fbutton>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ obBeforePass }}\" hint-placeholder-val=\"{{ true }}\">\n                      <span sc-camel-on-click=\"{{ obSkip }}\" style=\"margin-left:auto;font-size:13px;font-weight:600;color:#868aa5;cursor:pointer\">Skip this step<\u002Fspan>\n                      <\u002Fsc-if>\n\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <!-- test scan -->\n              <sc-if value=\"{{ obIs.test }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-width:560px;margin:12px auto 0;text-align:center\">\n                <sc-if value=\"{{ testIdle }}\" hint-placeholder-val=\"{{ true }}\">\n                <div>\n                  <h1 style=\"font-family:'Wix Madefor Display';font-size:26px;font-weight:800;margin:0\">One scan before you open<\u002Fh1>\n                  <div style=\"font-size:14px;color:#5b6478;margin-top:9px;line-height:1.55\">This runs a sample pass against {{ obDoorName }} exactly as a real client would — same checks, same log. Test entries never show up in your reports.<\u002Fdiv>\n                  <div style=\"background:#fff;border:1px solid #e6e8ec;border-radius:16px;padding:30px;margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:18px\">\n                    <div style=\"width:132px;height:132px;border-radius:12px;background:repeating-conic-gradient(#151414 0 25%, #fff 0 50%) 0 0/14px 14px\"><\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ runTest }}\" style=\"height:44px;padding:0 26px;border-radius:22px;border:none;background:{{ accent }};color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit\">Run the test scan<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ testRunning }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background:#fff;border:1px solid #e6e8ec;border-radius:16px;padding:54px 30px;display:flex;flex-direction:column;align-items:center;gap:18px\">\n                  <span style=\"width:54px;height:54px;border-radius:50%;border:3px solid #e2e6ed;border-top-color:{{ accent }};animation:acSpin .8s linear infinite;display:block\"><\u002Fspan>\n                  <div style=\"font-size:14.5px;font-weight:700\">Checking the pass, the plan and the waiver…<\u002Fdiv>\n                  <div style=\"font-size:13px;color:#868aa5\">This is what happens in the half-second before the door opens.<\u002Fdiv>\n                <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ testDone }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>\n                  <div style=\"background:#fff;border:1px solid #b9e2cb;border-radius:16px;overflow:hidden;text-align:left\">\n                    <div style=\"background:#F1FAF5;padding:24px 26px;display:flex;align-items:center;gap:15px;border-bottom:1px solid #d9eee3\">\n                      <span style=\"width:44px;height:44px;border-radius:50%;background:#1F9D5B;display:grid;place-items:center;color:#fff;flex:0 0 44px;animation:acPulse 1.8s infinite\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <div><div style=\"font-family:'Wix Madefor Display';font-size:20px;font-weight:800;color:#0F5C3A\">Approved — the door would open<\u002Fdiv><div style=\"font-size:13px;color:#3B4257;margin-top:3px\">Arrivals is working end to end at {{ obDoorName }}.<\u002Fdiv><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"padding:6px 26px 18px\">\n                      <sc-for list=\"{{ testLines }}\" as=\"l\" hint-placeholder-count=\"5\">\n                        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #f1f2f5\">\n                          <span style=\"font-size:12.5px;color:#868aa5;font-weight:600\">{{ l.label }}<\u002Fspan>\n                          <span style=\"font-size:13.5px;color:#16213A;font-weight:600;text-align:right\">{{ l.value }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px\">\n                    <button sc-camel-on-click=\"{{ finishSetup }}\" style=\"height:44px;padding:0 24px;border-radius:22px;border:none;background:{{ accent }};color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit\">Go to Arrivals<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ testAgain }}\" style=\"height:44px;padding:0 20px;border-radius:22px;border:1px solid #c5cad3;background:#fff;color:#16213A;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit\">Run it again<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <\u002Fsc-if>\n\n          <!-- ============ SETTINGS ============ -->\n          <sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n\n            <!-- ===== SETTINGS · DOORS INDEX ===== -->\n            <sc-if value=\"{{ sIndex }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:20px 28px 50px\">\n              <span sc-camel-on-click=\"{{ goDash }}\" style=\"display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#2B5CE6;font-weight:600;cursor:pointer;margin-bottom:10px\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"><\u002Fpath><\u002Fsvg>Back to {{ appName }}<\u002Fspan>\n              <h1 style=\"font-family:'Wix Madefor Display';font-size:24px;font-weight:800;margin:2px 0 4px\">Setup<\u002Fh1>\n              <div style=\"font-size:13.5px;color:#5b6478;max-width:620px;line-height:1.5\">Hardware, plans and intake forms are all set up per door. Open a door to manage them.<\u002Fdiv>\n\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:880px;margin:26px 0 12px\">\n                <div style=\"display:flex;align-items:center;gap:12px\">\n                  <div style=\"font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#a2a8b3\">Doors at<\u002Fdiv>\n                <div style=\"position:relative\">\n                  <div sc-camel-on-click=\"{{ toggleLocMenu }}\" style=\"height:38px;border:1px solid #c5cad3;border-radius:8px;background:#fff;display:inline-flex;align-items:center;gap:9px;padding:0 13px;cursor:pointer\" style-hover=\"border-color:#A8A6A5\">\n                    <svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#868aa5\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:0 0 16px\"><path d=\"M12 21s-7-5.6-7-11a7 7 0 0114 0c0 5.4-7 11-7 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.5\"><\u002Fcircle><\u002Fsvg>\n                    <span style=\"font-size:14px;font-weight:600;color:#16213A\">{{ loc.name }}<\u002Fspan>\n                    <span style=\"font-size:13px;color:#868aa5\">{{ loc.addr }}<\u002Fspan>\n                    <svg sc-camel-view-box=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"#868aa5\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:0 0 14px\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ locMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div sc-camel-on-click=\"{{ toggleLocMenu }}\" style=\"position:fixed;inset:0;z-index:55\"><\u002Fdiv>\n                  <div style=\"position:absolute;top:44px;left:0;width:290px;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;box-shadow:0 12px 30px rgba(19,23,32,.10);padding:6px 0;z-index:60\">\n                    <sc-for list=\"{{ locOptions }}\" as=\"l\" hint-placeholder-count=\"2\">\n                      <div sc-camel-on-click=\"{{ l.go }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer\" style-hover=\"background:#F8F6F6\">\n                        <div style=\"flex:1;min-width:0\"><div style=\"font-size:14px;font-weight:600;color:#151414\">{{ l.name }}<\u002Fdiv><div style=\"font-size:12px;color:#767574;margin-top:2px\">{{ l.addr }} · {{ l.doorCount }}<\u002Fdiv><\u002Fdiv>\n                        <span style=\"color:{{ l.tick }};flex:0 0 16px\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 13l4 4L19 7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <div sc-camel-on-click=\"{{ toast_addLocation }}\" style=\"display:flex;align-items:center;gap:9px;padding:11px 14px;margin-top:4px;border-top:1px solid #F0EFEF;cursor:pointer;color:{{ accent }};font-size:13.5px;font-weight:600\" style-hover=\"background:#F8F6F6\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>Set up a new location<\u002Fdiv>\n                  <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ toast_addDoor }}\" style=\"height:36px;padding:0 16px;border-radius:18px;border:none;background:{{ accent }};color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit\">Add door<\u002Fbutton>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-direction:column;gap:12px;max-width:880px\">\n                <sc-for list=\"{{ doorCards }}\" as=\"d\" hint-placeholder-count=\"3\">\n                  <div sc-camel-on-click=\"{{ d.open }}\" style=\"background:#fff;border:1px solid #e6e8ec;border-radius:12px;overflow:hidden;cursor:pointer\" style-hover=\"border-color:#c5cad3\">\n                    <div style=\"display:flex;align-items:center;gap:14px;padding:16px 18px\">\n                      <span style=\"width:38px;height:38px;border-radius:9px;background:#f0f2f6;display:grid;place-items:center;color:#595d70;flex:0 0 38px\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 21h16M6 21V4a1 1 0 011-1h8a1 1 0 011 1v17\"><\u002Fpath><circle cx=\"13\" cy=\"12\" r=\"1\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n                      <div style=\"flex:1;min-width:0\"><div style=\"font-size:15px;font-weight:700\">{{ d.name }}<\u002Fdiv><div style=\"font-size:12.5px;color:#5b6478;margin-top:2px\">{{ d.meta }}<\u002Fdiv><\u002Fdiv>\n                      <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:{{ d.statusColor }};background:{{ d.statusBg }};border-radius:12px;padding:4px 10px\">{{ d.status }}<\u002Fspan>\n                      <svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#b6c1cd\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fdiv>\n                    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #f1f2f5;background:#FBFCFD\">\n                      <sc-for list=\"{{ d.chips }}\" as=\"c\" hint-placeholder-count=\"3\">\n                        <div style=\"padding:11px 18px;border-left:1px solid {{ c.sep }}\">\n                          <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#a2a8b3\">{{ c.label }}<\u002Fdiv>\n                          <div style=\"font-size:13px;font-weight:600;color:{{ c.color }};margin-top:3px\">{{ c.value }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div sc-camel-on-click=\"{{ toast_addDoor }}\" style=\"border:1px dashed #c5cad3;border-radius:12px;padding:14px 18px;color:{{ accent }};font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;background:#fff\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>Add a door to {{ loc.name }}<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#a2a8b3;margin:32px 0 12px\">Applies to every door<\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #e6e8ec;border-radius:12px;max-width:880px;overflow:hidden\">\n                <sc-for list=\"{{ globalRows }}\" as=\"g\" hint-placeholder-count=\"3\">\n                  <div sc-camel-on-click=\"{{ g.go }}\" style=\"display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid #f1f2f5;cursor:pointer\" style-hover=\"background:#FBFCFD\">\n                    <div style=\"flex:1;min-width:0\"><div style=\"font-size:14.5px;font-weight:700\">{{ g.name }}<\u002Fdiv><div style=\"font-size:12.5px;color:#5b6478;margin-top:3px;line-height:1.45\">{{ g.desc }}<\u002Fdiv><\u002Fdiv>\n                    <span style=\"font-size:12.5px;color:#868aa5;flex:0 0 auto\">{{ g.value }}<\u002Fspan>\n                    <svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#b6c1cd\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ bookingsOn }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;align-items:center;gap:16px;padding:16px 18px\">\n                  <div style=\"flex:1;min-width:0\"><div style=\"font-size:14.5px;font-weight:700\">Log arrivals to the booking calendar<\u002Fdiv><div style=\"font-size:12.5px;color:#5b6478;margin-top:3px;line-height:1.45\">A check-in marks the client present on their booking.<\u002Fdiv><\u002Fdiv>\n                  <span sc-camel-on-click=\"{{ toggleLogArrival }}\" style=\"width:40px;height:24px;border-radius:12px;position:relative;background:{{ logArrivalTog.bg }};flex:0 0 40px;cursor:pointer;transition:background .15s\"><i style=\"position:absolute;top:2px;left:{{ logArrivalTog.x }};width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s\"><\u002Fi><\u002Fspan>\n                <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- ===== SETTINGS · ONE DOOR ===== -->\n            <sc-if value=\"{{ sDoor }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:20px 28px 50px;max-width:880px\">\n              <div style=\"display:flex;align-items:center;gap:7px;font-size:13px;color:#5b6478;margin-bottom:14px\"><span sc-camel-on-click=\"{{ backToSettingsIndex }}\" style=\"cursor:pointer;color:#2B5CE6;font-weight:600\">Setup<\u002Fspan><svg sc-camel-view-box=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"#b6c1cd\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><span style=\"color:#16213A;font-weight:600\">{{ door.name }}<\u002Fspan><\u002Fdiv>\n\n              <div style=\"display:flex;align-items:flex-start;gap:14px\">\n                <span style=\"width:44px;height:44px;border-radius:11px;background:#EAF0FF;display:grid;place-items:center;color:{{ accent }};flex:0 0 44px;margin-top:2px\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 21h16M6 21V4a1 1 0 011-1h8a1 1 0 011 1v17\"><\u002Fpath><circle cx=\"13\" cy=\"12\" r=\"1\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><h1 style=\"font-family:'Wix Madefor Display';font-size:24px;font-weight:800;margin:0\">{{ door.name }}<\u002Fh1><span style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:{{ door.statusColor }};background:{{ door.statusBg }};border-radius:12px;padding:4px 10px\">{{ door.status }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-size:13px;color:#5b6478;margin-top:5px\">{{ door.meta }} · {{ door.todayCount }} arrivals logged today<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:9px;flex:0 0 auto\">\n                  <button sc-camel-on-click=\"{{ toast_rename }}\" style=\"height:36px;padding:0 15px;border-radius:18px;border:1px solid #c5cad3;background:#fff;color:#16213A;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit\">Rename<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ toast_removeDoor }}\" style=\"height:36px;padding:0 15px;border-radius:18px;border:1px solid #c5cad3;background:#fff;color:#16213A;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit\">Remove<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#a2a8b3;margin:28px 0 10px\">Hardware at this door<\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #e6e8ec;border-radius:12px;overflow:hidden\">\n                <sc-for list=\"{{ door.devices }}\" as=\"hw\" hint-placeholder-count=\"1\">\n                  <div style=\"display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid #f1f2f5\">\n                    <span style=\"width:44px;height:44px;border-radius:10px;background:{{ hw.iconBg }};display:grid;place-items:center;color:{{ hw.iconFg }};flex:0 0 44px\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"11\" rx=\"2\"><\u002Frect><path d=\"M8 10V7a4 4 0 018 0v3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                    <div style=\"flex:1;min-width:0\"><div style=\"font-size:14.5px;font-weight:700\">{{ hw.name }}<\u002Fdiv><div style=\"font-size:12.5px;color:#5b6478;margin-top:2px\">{{ hw.meta }}<\u002Fdiv><\u002Fdiv>\n                    <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:{{ hw.stColor }};background:{{ hw.stBg }};border-radius:12px;padding:5px 11px\">{{ hw.state }}<\u002Fspan>\n                    <span sc-camel-on-click=\"{{ hw.manage }}\" style=\"font-size:13px;font-weight:600;color:{{ accent }};cursor:pointer;flex:0 0 auto\">{{ hw.action }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ door.noDevices }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:18px;font-size:13px;color:#5b6478;border-bottom:1px solid #f1f2f5;line-height:1.5\">No hardware here yet — arrivals at this door are logged by staff scan, pass or self check-in.<\u002Fdiv>\n                <\u002Fsc-if>\n                <div sc-camel-on-click=\"{{ toast_connectDevice }}\" style=\"display:flex;ali x;padding:26px;text-align:center\">\n                <div style=\"font-size:15px;font-weight:800;font-family:'Wix Madefor Display'\">Add Wix Forms to require intake forms<\u002Fdiv>\n                <div style=\"font-size:13px;color:#5b6478;line-height:1.5;max-width:400px;margin:7px auto 16px\">Require a signed waiver or health form before this door opens.<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ installForms }}\" style=\"height:38px;padding:0 20px;border-radius:19px;border:none;background:{{ accent }};color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit\">Install Wix Forms<\u002Fbutton>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- ===== SETTINGS · MEMBER PASS (business-wide) ===== -->\n            <sc-if value=\"{{ sPass }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:20px 28px 0\">\n              <div style=\"display:flex;align-items:center;gap:7px;font-size:13px;color:#5b6478;margin-bottom:14px\"><span sc-camel-on-click=\"{{ backToSettingsIndex }}\" style=\"cursor:pointer;color:#2B5CE6;font-weight:600\">Setup<\u002Fspan><svg sc-camel-view-box=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"#b6c1cd\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><span style=\"color:#16213A;font-weight:600\">Member pass<\u002Fspan><\u002Fdiv>\n              <h1 style=\"font-family:'Wix Madefor Display';font-size:24px;font-weight:800;margin:2px 0 4px\">Member pass<\u002Fh1>\n              <div style=\"font-size:13.5px;color:#5b6478;max-width:600px;line-height:1.5\">Each client gets a single pass. It carries whichever plan they hold and opens every door that plan allows — no separate pass per door or per location.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:22px 28px 50px\">\n              \n              <sc-if value=\" position:absolute;right:13px;top:13px;pointer-events:none\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                      <button sc-camel-on-click=\"{{ generatePass }}\" style=\"height:42px;padding:0 20px;border-radius:9px;border:none;background:{{ accent }};color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;flex:0 0 auto\">Generate pass<\u002Fbutton>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ issueGenerated }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div sc-camel-on-click=\"{{ closeIssue }}\" style=\"position:fixed;inset:0;background:rgba(11,17,40,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px\">\n                      <div sc-camel-on-click=\"{{ stop }}\" style=\"background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(11,17,40,.25);width:460px;max-width:100%;padding:24px\">\n                        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px\"><div style=\"font-size:18px;font-weight:800;font-family:'Wix Madefor Display'\">Pass ready for {{ issueClient }}<\u002Fdiv><span sc-camel-on-click=\"{{ closeIssue }}\" style=\"cursor:pointer;color:#868aa5;flex:0 0 auto;margin-top:2px\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fdiv>\n                        <div style=\"font-size:13px;color:#5b6478;line-height:1.5;margin-bottom:18px\">Share the link so they can add the Pass to their wallet, or have them scan the code.<\u002Fdiv>\n                        <div style=\"display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap\">\n                          <div style=\"flex:1;min-width:220px\">\n                            <div style=\"font-size:12px;font-weight:700;color:#162  reader', time:'9:03 AM', photo:'https://randomuser.me/api/portraits/women/68.jpg' },\n    ],\n    history: [\n      { id:1, initials:'JR', name:'Jordan Reyes', avColor:'#116DFF', res:'ok', result:'Approved', door:'Front Entrance', method:'Staff scan', plan:'Unlimited membership', time:'9:07 AM', photo:'https://randomuser.me/api/portraits/men/32.jpg' },\n      { id:2, initials:'MC', name:'Maya Cohen', avColor:'#51B77B', res:'ok', result:'Approved', door:'Front Entrance', method:'Kiosk', plan:'Vinyasa Flow', time:'9:05 AM', photo:'https://randomuser.me/api/portraits/women/44.jpg' },\n      { id:3, initials:'DK', name:'Dana Katz', avColor:'#E8951C', res:'wn', result:'Let in · warned', door:'Pool gate', method:'Kisi reader', plan:'Off-peak (lapsed?)', time:'9:03 AM', photo:'https://randomuser.me/api/portraits/women/68.jpg' },\n      { id:4, initials:'EL', name:'Erin Lee', avColor:'#5A48F5', res:'ok', result:'Approved', door:'Front Entrance', method:'QR pass', plan:'Off-peak · 1 credit', time:'8:58 AM', photo:'https://randomuser.me/api/portraits/women/28.jpg' },\n      { id:5, initials:'NB', name:'Noa Bar', avColor:'#868AA5', res:'ok', result:'Approved', door:'Front Entrance', method:'Guest pass', plan:'Vinyasa Flow · email', time:'8:55 AM', photo:'https://randomuser.me/api/portraits/women/33.jpg' },\n      { id:6, initials:'TA', name:'Tom Adler', avColor:'#E5674E', res:'er', result:'Denied', door:'Studio B side door', method:'Staff scan', plan:'No active plan', time:'8:49 AM', photo:'https://randomuser.me/api/portraits/men/54.jpg' },\n      { id:7, initials:'SG', name:'Sara Gold', avColor:'#2BC5B4', res:'ok', result:'Approved', door:'Pool gate', method:'Kisi reader', plan:'Unlimited membership', time:'8:41 AM', photo:'https://randomuser.me/api/portraits/women/50.jpg' },\n      { id:8, initials:'RM', name:'Ravi Mehta', avColor:'#9C1AB1', res:'er', result:'Denied', door:'Front Entrance', method:'Kiosk', plan:'Membership expired', time:'8:30 AM', photo:'https://randomuser.me/api/portraits/men/61.jpg' },\n    ],\n  };\n\n  componentDidMount() {\n    if (!this.state.layout) this.setState({ layout: this.props.defaultLayout || 'A' });\n  }\n\n  toast(msg) {\n    this.setState({ toastMsg: msg });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toastMsg: '' }), 2600);\n  }\n\n  simulate() {\n    const p = POOL[Math.floor(Math.random() * POOL.length)];\n    const roll = Math.random();\n    const res = roll > 0.82 ? 'er' : (roll > 0.68 ? 'wn' : 'ok');\n    const door = DOORPOOL[Math.floor(Math.random() * DOORPOOL.length)];\n    const result = res === 'ok' ? 'Approved' : (res === 'wn' ? 'Warning' : 'Denied');\n    const detail = res === 'er' ? 'No active plan' : p.detail;\n    const id = Date.now();\n    this.setState(s => ({\n      added: s.added + 1,\n      live: [{ id, initials:p.initials, name:p.name, avColor:p.avColor, photo:p.photo, res, result, detail, door, source:'Staff scan', time:'Just now' }, ...s.live].slice(0, 8),\n      history: [{ id, initials:p.initials, name:p.name, avColor:p.avColor, photo:p.photo, res, result, door, method:'Staff scan', plan:detail, time:'Just now' }, ...s.history],\n    }));\n  }\n\n  manualCheckin(c) {\n    const id = Date.now();\n    this.setState(s => {\n      const liveRow = { id, initials:c.initials, name:c.name, avColor:c.avColor, photo:c.photo, res:'ok', result:'Approved', detail:c.svc, door:'Front Entrance', source:'Manual entry', time:'Just now' };\n      const histRow = { id, initials:c.initials, name:c.name, avColor:c.avColor, photo:c.photo, res:'ok', result:'Approved · manual', door:'Front Entrance', method:'Manual entry', plan:c.svc, time:'Just now' };\n      // during the first run there is no seeded data — the manual entry becomes the first arrival\n      const prevLive = s.fresh ? [] : s.live;\n      const prevHist = s.fresh ? [] : s.history;\n      return {\n        added: s.fresh ? 0 : s.added + 1,\n        fresh: false,\n        demoBase: s.fresh ? 0 : s.demoBase,\n        manualDone: [...(s.manualDone || []), c.name],\n        live: [liveRow, ...prevLive].slice(0, 8),\n        history: [histRow, ...prevHist],\n      };\n    });\n    this.toast(c.name + ' checked in');\n  }\n\n  startFirstRun(entry) {\n    this.setState({\n      view:'arrivals', page:'onboard', obEntry: entry || null,\n      obStep: -1, obDone: {},\n      hwPath: null, paired: false, testState: 'idle',\n      fresh: true, firstBanner: false, demoBase: 120, arrivalsInstalled: true,\n      manualOpen: false, contact: null,\n    });\n  }\n\n  obNextFrom(idx) {\n    this.setState(s => ({ obDone: { ...(s.obDone || {}), [OB_KEYS[idx]]: true }, obStep: idx + 1 }));\n  }\n\n  runTest() {\n    this.setState({ testState: 'running' });\n    clearTimeout(this._tt);\n    this._tt = setTimeout(() => this.setState({ testState: 'done' }), 1500);\n  }\n\n  finishSetup() {\n    this.setState({ page:'dashboard', fresh:true, testState:'idle', obStep:0, confetti:true });\n    this.toast('Arrivals is live at Front Entrance');\n    clearTimeout(this._cf);\n    this._cf = setTimeout(() => this.setState({ confetti:false }), 3400);\n  }\n\n  firstArrival() {\n    this.setState({ fresh:false, firstBanner:true, live:[FIRST_ARR], history:[FIRST_ARR], added:0, demoBase:0 });\n  }\n\n  renderVals() {\n    const accent = this.props.accent || '#2B5CE6';\n    const appName = this.props.appName || 'Arrivals';\n    const layout = this.state.layout || 'A';\n    const freshRun = !!this.state.fresh;\n    const srcLive = freshRun ? [] : this.state.live;\n    const srcHist = freshRun ? [] : this.state.history;\n    const decLive = srcLive.map(p => ({ ...p, ...pick(p.res), photoEl: photoImg(p.photo), openContact: () => this.setState({ contact: p }) }));\n    const q = this.state.query.trim().toLowerCase();\n    const hist = q ? srcHist.filter(h => h.name.toLowerCase().includes(q)) : srcHist;\n    const shownHistory = hist.map(h => ({ ...h, dotColor: RES[h.res].dot, photoEl: photoImg(h.photo),\n      openContact: () => this.setState({ contact: h }) }));\n    const cc = this.state.contact;\n    const contact = cc ? { ...cc, photoEl: photoImg(cc.photo),\n      email: cc.name.toLowerCase().replace(/[^a-z]+/g,'.') + '@gmail.com',\n      phone: '052 487 956' } : { name:'', initials:'', avColor:'#868AA5', photoEl:null, email:'', phone:'' };\n\n    const seg = on => on ? { bg: accent, fg: '#fff' } : { bg: '#fff', fg: '#16213A' };\n    const chk = (on, go) => ({ chkBg: on ? accent : '#fff', chkBorder: on ? accent : '#c5cad3', go });\n    const card = on => ({ border: on ? accent : '#d5dae2', bg: on ? '#F5F8FF' : '#fff' });\n    const doorSel = (key, on) => ({ chkBg: on ? accent : '#fff', chkBorder: on ? accent : '#c5cad3', border: on ? accent : '#e6e8ec', bg: on ? '#F5F8FF' : '#fff', go: () => this.setState(s => ({ [key]: !on })) });\n    const dayTog = (key, on) => ({ bg: on ? accent : '#cdd7e0', xs: on ? '15px' : '2px', tc: on ? '#16213A' : '#a2a8b3', go: () => this.setState(s => ({ [key]: !on })) });\n    const pTog = key => ({ bg: this.state[key] ? accent : '#cdd7e0', x: this.state[key] ? '18px' : '2px', xs: this.state[key] ? '15px' : '2px', go: () => this.setState(s => ({ [key]: !s[key] })) });\n    const tab = id => ({\n      fg: this.state.tab === id ? accent : '#5b6478',\n      bar: this.state.tab === id ? accent : 'transparent',\n      wt: this.state.tab === id ? '700' : '600',\n      go: () => this.setState({ tab: id }),\n    });\n\n    const mq = this.state.mQuery.trim().toLowerCase();\n    const clientsRaw = [\n      { initials:'AV', name:'Ava Silva', avColor:'#7B3FF2', svc:'Unlimited membership', photo:'https://randomuser.me/api/portraits/women/65.jpg' },\n      { initials:'LF', name:'Liam Ford', avColor:'#2BC5B4', svc:'10-class pack · 4 left', photo:'https://randomuser.me/api/portraits/men/45.jpg' },\n      { initials:'PR', name:'Priya Rao', avColor:'#E5674E', svc:'Vinyasa Flow · 9:30 AM', photo:'https://randomuser.me/api/portraits/women/12.jpg' },\n      { initials:'BJ', name:'Ben Joss', avColor:'#3A6BD4', svc:'Off-peak membership', photo:'https://randomuser.me/api/portraits/men/22.jpg' },\n      { initials:'GV', name:'Guest · Noa Bar', avColor:'#868AA5', svc:'Single session · booked', photo:'https://randomuser.me/api/portraits/women/33.jpg' },\n      { initials:'SW', name:'Sam Winter', avColor:'#9C1AB1', svc:'Monthly membership', photo:'https://randomuser.me/api/portraits/men/52.jpg' },\n    ];\n    const manualClients = clientsRaw\n      .filter(c => !mq || c.name.toLowerCase().includes(mq))\n      .map(c => ({ ...c, done: (this.state.manualDone || []).includes(c.name), notDone: !(this.state.manualDone || []).includes(c.name), checkin: () => this.manualCheckin(c) }));\n\n    const tog = (on, col) => ({ bg: on ? (col || accent) : '#cdd7e0', x: on ? '16px' : '2px' });\n    const plansRaw = [\n      { name:'Unlimited membership', subsTotal:'212', subsActive:'184', meta:'Recurring', grant:true, credit:false, hours:'24/7', hoursColor:'#16213A', doors:'All doors' },\n      { name:'Off-peak membership', subsTotal:'118', subsActive:'92', meta:'Recurring', grant:true, credit:false, hours:'10:00–16:00', hoursColor:'#16213A', doors:'Front Entrance, Studio B' },\n      { name:'10-class pack', subsTotal:'63', subsActive:'47', meta:'Limited · 10 sessions', grant:false, credit:true, hours:'—', hoursColor:'#9aa0ad', doors:'Not connected' },\n      { name:'Monthly membership', subsTotal:'149', subsActive:'126', meta:'Recurring · 12 entries/mo', grant:true, credit:true, hours:'06:00–22:00', hoursColor:'#16213A', doors:'Front Entrance' },\n    ];\n    const allDoors = ['Front Entrance', 'Studio B side door', 'Pool gate'];\n    const planDoorSel = this.state.planDoors || {\n      'Unlimited membership': ['Front Entrance','Studio B side door','Pool gate'],\n      'Off-peak membership': ['Front Entrance','Studio B side door'],\n      '10-class pack': [],\n      'Monthly membership': ['Front Entrance'],\n    };\n    const plans = plansRaw.map(p => {\n      const g = tog(p.grant), c = tog(p.credit);\n      const picked = planDoorSel[p.name] || [];\n      const label = picked.length === 0 ? 'Not connected' : picked.length === allDoors.length ? 'All doors' : picked.join(', ');\n      const connected = picked.length > 0;\n      return { ...p, grantBg:g.bg, grantX:g.x, creditBg:c.bg, creditX:c.x,\n        doors: label,\n        doorColor: connected ? '#16213A' : '#9aa0ad',\n        doorBorder: connected ? '#c5cad3' : '#e6e8ec',\n        menuOpen: this.state.doorMenu === p.name,\n        toggleMenu: () => this.setState(s => ({ doorMenu: s.doorMenu === p.name ? null : p.name })),\n        doorOptions: allDoors.map(d => {\n          const on = picked.includes(d);\n          return { name: d, chkBg: on ? accent : '#fff', chkBorder: on ? accent : '#c5cad3',\n            go: () => this.setState(s => {\n              const cur = (s.planDoors || planDoorSel)[p.name] || [];\n              const next = cur.includes(d) ? cur.filter(x => x !== d) : [...cur, d];\n              return { planDoors: { ...(s.planDoors || planDoorSel), [p.name]: next } };\n            }) };\n        }) };\n    });\n    const formsRaw = [\n      { name:'Liability waiver', meta:'Required · all clients', on:true },\n      { name:'Health declaration', meta:'Required · first visit', on:true },\n      { name:'Membership agreement', meta:'Optional', on:false },\n    ];\n    const formDoorSel = this.state.formDoors || {\n      'Liability waiver': ['Front Entrance','Studio B side door','Pool gate'],\n      'Health declaration': ['Front Entrance'],\n      'Membership agreement': [],\n    };\n    const forms = formsRaw.map(fm => {\n      const on = this.state.formOn && (fm.name in this.state.formOn) ? this.state.formOn[fm.name] : fm.on;\n      const t = tog(on);\n      const picked = formDoorSel[fm.name] || [];\n      const label = picked.length === 0 ? 'No doors' : picked.length === allDoors.length ? 'All doors' : picked.join(', ');\n      return { ...fm, onBg:t.bg, onX: on ? '18px' : '2px',\n        toggleOn: () => this.setState(s => ({ formOn: { ...(s.formOn || {}), [fm.name]: !on } })),\n        doors: label,\n        doorColor: picked.length ? '#16213A' : '#9aa0ad',\n        doorBorder: picked.length ? '#c5cad3' : '#e6e8ec',\n        menuOpen: this.state.formDoorMenu === fm.name,\n        toggleMenu: () => this.setState(s => ({ formDoorMenu: s.formDoorMenu === fm.name ? null : fm.name })),\n        doorOptions: allDoors.map(d => {\n          const dOn = picked.includes(d);\n          return { name: d, chkBg: dOn ? accent : '#fff', chkBorder: dOn ? accent : '#c5cad3',\n            go: () => this.setState(s => {\n              const cur = (s.formDoors || formDoorSel)[fm.name] || [];\n              const next = cur.includes(d) ? cur.filter(x => x !== d) : [...cur, d];\n              return { formDoors: { ...(s.formDoors || formDoorSel), [fm.name]: next } };\n            }) };\n        }) };\n    });\n\n    const erCount = this.state.history.filter(h => h.res === 'er').length;\n\n    // ---- door-centric settings: hardware, plans and forms live on the door ----\n    const locDefs = [\n      { id:'broadway', name:'Broadway studio', addr:'620 Broadway' },\n      { id:'hudson', name:'Hudson yards', addr:'55 Hudson Yards' },\n    ];\n    const doorDefs = [\n      { id:'front', loc:'broadway', name:'Front Entrance', meta:'Main door · street level', status:'Online', today:'96' },\n      { id:'studiob', loc:'broadway', name:'Studio B side door', meta:'Class studio · lower floor', status:'Online', today:'18' },\n      { id:'pool', loc:'broadway', name:'Pool gate', meta:'Turnstile · outdoor deck', status:'Needs setup', today:'6' },\n      { id:'hmain', loc:'hudson', name:'Main entrance', meta:'Lobby · level 1', status:'Online', today:'41' },\n      { id:'hstudio', loc:'hudson', name:'Cycle studio door', meta:'Level 2 · staff only for now', status:'Needs setup', today:'0' },\n    ];\n    const defaultCfg = {\n
