document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nter\" style-hover=\"background:#fdf3f2\">Disconnect Number<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #e5e5e5;border-radius:10px;padding:15px 16px;margin-top:12px\">\n          <div style=\"font-size:14.5px;font-weight:600\">Call forwarding<\u002Fdiv>\n          <div style=\"font-size:13px;color:#5c5a5a;margin-top:2px;line-height:1.5;max-width:620px\">Route calls from your existing number to your agent. The setup guide has the steps for your provider.<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:14px;margin-top:13px;flex-wrap:wrap\">\n            <button style=\"background:#fff;border:1px solid #dedede;border-radius:8px;padding:7px 15px;font-size:13.5px;font-weight:600;color:#151414;cursor:pointer\" style-hover=\"background:#f8f6f6\">Open Setup Guide<\u002Fbutton>\n            <span style=\"font-size:13px;color:#8a8888\">Connecting a Google Voice number? <a style=\"cursor:pointer;font-weight:600\">Get verification code<\u002Fa><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #e5e5e5;border-radius:10px;padding:15px 16px;margin-top:12px\">\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n              <div style=\"font-size:14.5px;font-weight:600\">How the agent handles calls<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ goSettings }}\" style=\"margin-left:auto;background:#151414;border:none;border-radius:8px;padding:8px 18px;font-size:13.5px;font-weight:600;color:#fff;cursor:pointer;white-space:nowrap\" style-hover=\"background:#3b3939\">Agent settings<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;color:#5c5a5a;margin-top:2px;line-height:1.5\">It greets the caller, answers from your knowledge and takes the actions you allow. Everything it does appears in Inbox.<\u002Fdiv>\n\n            <sc-if value=\"{{ agentOn }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:16px\">\n                <div style=\"font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#8a8888\">When it picks up<\u002Fdiv>\n                <div style=\"display:flex;background:#f3f1f1;border:1px solid #dedede;border-radius:18px;padding:3px;gap:2px;margin-top:8px;width:fit-content;max-width:100%;flex-wrap:wrap\">\n                  <sc-for list=\"{{ whenOpts }}\" as=\"w\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ w.pick }}\" style=\"{{ w.style }}\">{{ w.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#8a8888;margin-top:8px\">{{ whenNote }}<\u002Fdiv>\n\n                <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:18px\">\n                  <sc-for list=\"{{ phoneOpts }}\" as=\"o\" hint-placeholder-count=\"3\">\n                    <div sc-camel-on-click=\"{{ o.toggle }}\" style=\"display:flex;align-items:flex-start;gap:10px;cursor:pointer\">\n                      <div style=\"{{ o.track }}\"><span style=\"{{ o.knob }}\"><\u002Fspan><\u002Fdiv>\n                      <div style=\"min-width:0\">\n                        <div style=\"font-size:13.5px;font-weight:600\">{{ o.name }}<\u002Fdiv>\n                        <div style=\"font-size:12.5px;color:#8a8888;margin-top:1px;line-height:1.45\">{{ o.desc }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <div style=\"border:1px solid #e5e5e5;border-radius:9px;padding:13px 15px;margin-top:18px\">\n                  <div style=\"display:flex;align-items:baseline;gap:8px\">\n                    <span style=\"font-size:13.5px;font-weight:600\">AI credits<\u002Fspan>\n                    <span style=\"margin-left:auto;font-size:13px;color:#5c5a5a\">75 of 300 remaining<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:6px;border-radius:6px;background:#eceaea;margin-top:9px;overflow:hidden\"><span style=\"display:block;height:100%;width:25%;background:#f9ad4d;border-radius:6px\"><\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:10px;margin-top:10px\">\n                    <span style=\"font-size:12.5px;color:#8a8888\">Credits are shared across every channel the agent works on. When they run out, calls go to voicemail.<\u002Fspan>\n                    <a style=\"font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;margin-left:auto\">Get more credits<\u002Fa>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;align-items:center;gap:10px;background:#f5f8ff;border:1px solid #dbe6ff;border-radius:9px;padding:11px 14px;margin-top:14px\">\n                  <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2f5dff\" stroke-width=\"1.9\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 11v5M12 8v.1\"><\u002Fpath><\u002Fsvg>\n                  <span style=\"font-size:13px;color:#3b3939\">What the agent can do and how it sounds is set once for every channel in Inbox Settings.<\u002Fspan>\n                  <a sc-camel-on-click=\"{{ goSettings }}\" style=\"font-size:13px;font-weight:600;white-space:nowrap;margin-left:auto;cursor:pointer\">Open Inbox Settings<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border-radius:12px;padding:24px 26px 20px;margin-bottom:20px\">\n        <h2 style=\"font-family:'Wix Madefor Display',sans-serif;font-size:18px;font-weight:700;margin:0 0 5px\">Email channels<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:14px;color:#5c5a5a\">Manage all email communication with your site visitors and customers directly in Wix Inbox.<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:12px;border:1px solid #dbe6ff;background:#f5f8ff;border-radius:9px;padding:11px 14px;margin-bottom:18px\">\n          <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2f5dff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 9h4l8-4v14l-8-4H4z\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-size:13.5px;color:#3b3939\">Build trust with a professional email at your custom domain.<\u002Fspan>\n          <button style=\"margin-left:auto;background:#fff;border:1px solid #116dff;color:#116dff;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap\" style-hover=\"background:#f0f4ff\">Get Business Email<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-for list=\"{{ emailChannels }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div style=\"{{ c.rowStyle }}\">\n            <span style=\"{{ c.iconStyle }}\">{{ c.mark }}<\u002Fspan>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                <span style=\"font-size:15px;font-weight:600\">{{ c.name }}<\u002Fspan>\n                <sc-if value=\"{{ c.connected }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:11px;font-weight:600;color:#1a6b3f;background:#e6f4ec;padding:2px 8px;border-radius:4px\">Connected<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#5c5a5a;margin-top:3px;line-height:1.5;max-width:640px\">{{ c.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button style=\"{{ c.btnStyle }}\">{{ c.cta }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"font-size:13.5px;color:#5c5a5a;padding-top:16px\">Need to connect a different email provider? <a style=\"cursor:pointer\">Request an integration<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border-radius:12px;padding:24px 26px 22px\">\n        <h2 style=\"font-family:'Wix Madefor Display',sans-serif;font-size:18px;font-weight:700;margin:0 0 5px\">Direct message channels<\u002Fh2>\n        <p style=\"margin:0 0 6px;font-size:14px;color:#5c5a5a\">Communicate with your visitors via all of their channels, all from within Wix Inbox.<\u002Fp>\n        <sc-for list=\"{{ dmChannels }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"{{ c.rowStyle }}\">\n            <span style=\"{{ c.iconStyle }}\">{{ c.mark }}<\u002Fspan>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                <span style=\"font-size:15px;font-weight:600\">{{ c.name }}<\u002Fspan>\n                <sc-if value=\"{{ c.connected }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:11px;font-weight:600;color:#1a6b3f;background:#e6f4ec;padding:2px 8px;border-radius:4px\">Connected<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#5c5a5a;margin-top:3px;line-height:1.5;max-width:640px\">{{ c.desc }}<\u002Fdiv>\n              <sc-if value=\"{{ c.connected }}\" hint-placeholder-val=\"{{ true }}\">\n                <div sc-camel-on-click=\"{{ c.toggleAi }}\" style=\"display:inline-flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer\">\n                  <div style=\"{{ c.track }}\"><span style=\"{{ c.knob }}\"><\u002Fspan><\u002Fdiv>\n                  <span style=\"{{ c.aiLabelStyle }}\">{{ c.aiLabel }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <button style=\"{{ c.btnStyle }}\">{{ c.cta }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ viewSettings }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;min-height:0;overflow-y:auto;padding:24px 28px 60px\">\n    <div style=\"max-width:1080px;margin:0 auto\">\n      <div style=\"display:flex;align-items:center;gap:7px;font-size:13.5px;color:#5c5a5a\"><span sc-camel-on-click=\"{{ goInbox }}\" style=\"cursor:pointer\">Inbox<\u002Fspan> <span style=\"color:#c4c2c2\">/<\u002Fspan> <span style=\"color:#151414\">Inbox Settings<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-start;gap:16px;margin:14px 0 22px\">\n        <div style=\"flex:1;min-width:0\">\n          <h1 style=\"font-family:'Wix Madefor Display',sans-serif;font-size:28px;font-weight:700;margin:0 0 6px\">Inbox Settings<\u002Fh1>\n          <p style=\"margin:0;font-size:14.5px;color:#5c5a5a\">Manage how you send and receive Inbox messages, what your AI agent handles, and who sees them.<\u002Fp>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goInbox }}\" style=\"display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:13.5px;font-weight:600;color:#151414;background:#fff;border:1px solid #dedede;border-radius:8px;padding:7px 15px;cursor:pointer;white-space:nowrap\" style-hover=\"background:#f8f6f6\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#151414\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg>Back to Inbox<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:20px;background:#fff;border-radius:12px;padding:22px 26px;margin-bottom:18px\">\n        <div style=\"flex:1;min-width:0\">\n          <h2 style=\"font-family:'Wix Madefor Display',sans-serif;font-size:18px;font-weight:700;margin:0 0 5px\">Connect communication channels<\u002Fh2>\n          <p style=\"margin:0 0 14px;font-size:14px;color:#5c5a5a\">Phone, email, chat and social — all in one Inbox, and all available to your AI agent.<\u002Fp>\n          <div style=\"display:flex;align-items:center;gap:16px\">\n            <button sc-camel-on-click=\"{{ goChannels }}\" style=\"background:#151414;color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer\" style-hover=\"background:#3b3939\">Connect Channels<\u002Fbutton>\n            <a style=\"font-size:14px;font-weight:600;cursor:pointer\">Learn more<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:-6px;flex-shrink:0\">\n          <sc-for list=\"{{ channelDots }}\" as=\"d\" hint-placeholder-count=\"4\">\n            <span style=\"{{ d.style }}\">{{ d.mark }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap\">\n        <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.style }}\">{{ t.label }}<sc-if value=\"{{ t.isNew }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:10px;font-weight:700;letter-spacing:.3px;color:#151414;background:#fbd8a0;padding:2px 6px;border-radius:4px;margin-left:8px\">New<\u002Fspan><\u002Fsc-if><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ tabAgent }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background:#fff;border-radius:12px;padding:24px 26px;margin-bottom:18px\">\n          <div style=\"display:flex;align-items:flex-start;gap:14px\">\n            <div style=\"flex:1;min-width:0\">\n              <h2 style=\"font-family:'Wix Madefor Display',sans-serif;font-size:18px;font-weight:700;margin:0 0 5px\">Your AI agent<\u002Fh2>\n              <p style=\"margin:0;font-size:14px;color:#5c5a5a;max-width:640px;line-height:1.55\">One agent works across every connected channel. It answers in your words, takes the actions you allow, and hands the conversation to you when it can’t help.<\u002Fp>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ toggleAgent }}\" style=\"{{ agentTrack }}\"><span style=\"{{ agentKnob }}\"><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#8a8888;margin-top:22px\">Where it replies<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px\">\n            <sc-for list=\"{{ agentChannels }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div sc-camel-on-click=\"{{ c.toggle }}\" style=\"{{ c.cardStyle }}\">\n                <span style=\"{{ c.iconStyle }}\">{{ c.mark }}<\u002Fspan>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:13.5px;font-weight:600\">{{ c.name }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#8a8888;margin-top:1px\">{{ c.state }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"{{ c.track }}\"><span style=\"{{ c.knob }}\"><\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#8a8888;margin-top:10px\">Channels are connected in <a sc-camel-on-click=\"{{ goChannels }}\" style=\"cursor:pointer\">Communication Channels<\u002Fa>.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border-radius:12px;padding:24px 26px;margin-bottom:18px\">\n          <h2 style=\"font-family:'Wix Madefor Display',sans-serif;font-size:18px;font-weight:700;margin:0 0 5px\">Personality<\u002Fh2>\n          <p style=\"margin:0 0 20px;font-size:14px;color:#5c5a5a\">How the agent introduces itself and sounds to customers.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px\">\n            <div>\n              <div style=\"font-size:13.5px;font-weight:600;margin-bottom:7px\">Name customers hear<\u002Fdiv>\n              <div style=\"border:1px solid #dedede;border-radius:8px;padding:10px 13px;font-size:14px;background:#fff\">Robin from Parky Spa<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#8a8888;margin-top:7px\">Used on calls and in chat. It always says it’s an assistant, not a person.<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:13.5px;font-weight:600;margin-bottom:7px\">Voice <span style=\"font-weight:400;color:#8a8888\">· phone only<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;background:#f3f1f1;border:1px solid #dedede;border-radius:18px;padding:3px;gap:2px;width:fit-content\">\n                <sc-for list=\"{{ voices }}\" as=\"v\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ v.pick }}\" style=\"{{ v.style }}\">{{ v.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button style=\"display:flex;align-items:center;gap:7px;background:none;border:none;padding:9px 0 0;font-size:13px;font-weight:600;color:#2f5dff;cursor:pointer\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2f5dff\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 4l12 8-12 8z\"><\u002Fpath><\u002Fsvg>Hear a sample<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:22px\">\n            <div style=\"font-size:13.5px;font-weight:600;margin-bottom:7px\">Tone<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ tones }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:22px\">\n            <div style=\"font-size:13.5px;font-weight:600;margin-bottom:7px\">Opening line<\u002Fdiv>\n            <div style=\"border:1px solid #dedede;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.55;color:#3b3939;max-width:720px\">{{ greeting }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8a8888;margin-top:7px\">On chat and WhatsApp the same line is sent as the first message.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:22px\">\n            <div style=\"font-size:13.5px;font-weight:600;margin-bottom:3px\">Hand over to a person when the customer says<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8a8888;margin-bottom:9px\">The agent stops, takes a message and flags the conversation for follow-up.<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n              <sc-for list=\"{{ keywords }}\" as=\"k\" hint-placeholder-count=\"5\">\n                <span style=\"display:inline-flex;align-items:center;gap:7px;font-size:13px;background:#f4f3f3;border-radius:16px;padding:6px 12px\">{{ k.word }}<span sc-camel-on-click=\"{{ k.remove }}\" style=\"cursor:pointer;color:#8a8888;font-size:14px;line-height:1\">×<\u002Fspan><\u002Fspan>\n              <\u002Fsc-for>\n              <button style=\"font-size:13px;font-weight:600;color:#2f5dff;background:none;border:1px dashed #c9d6ff;border-radius:16px;padding:6px 13px;cursor:pointer\">+ Add word<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border-radius:12px;padding:24px 26px;margin-bottom:18px\">\n          <div style=\"display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap\">\n            <div style=\"flex:1;min-width:0\">\n              <h2 style=\"font-family:'Wix Madefor Display',sans-serif;font-size:18px;font-weight:700;margin:0 0 5px\">Actions<\u002Fh2>\n              <p style=\"margin:0;font-size:14px;color:#5c5a5a;max-width:660px;line-height:1.55\">Choose what your agent can do for customers on any channel. Before an action marked <span style=\"font-size:10.5px;font-weight:600;color:#2f5dff;background:#eef2ff;padding:1px 3px 1px 6px;border-radius:4px;white-space:nowrap\">Verified caller<\u002Fspan>, the agent sends a one-time code by SMS or email and waits for the customer to read it back.<\u002Fp>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ turnAllOn }}\" style=\"{{ turnAllStyle }}\">{{ turnAllLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #e5e5e5;border-radius:8px;margin-top:16px\">\n            <sc-for list=\"{{ actGroups }}\" as=\"g\" hint-placeholder-count=\"6\">\n              <div style=\"{{ g.headStyle }}\">\n                <span style=\"font-size:12px;font-weight:700;color:#151414\">{{ g.name }}<\u002Fspan>\n                <span style=\"flex:1\"><\u002Fspan>\n                <button sc-camel-on-click=\"{{ g.toggle }}\" style=\"font-family:inherit;font-size:12.5px;font-weight:600;background:none;border:none;padding:2px;cursor:pointer;color:#2f5dff;white-space:nowrap\" style-hover=\"text-decoration:underline\">{{ g.toggleLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-for list=\"{{ g.items }}\" as=\"k\" hint-placeholder-count=\"2\">\n                <div sc-camel-on-click=\"{{ k.toggle }}\" style=\"display:flex;align-items:flex-start;gap:9px;padding:9px 14px;border-top:1px solid #f3f1f1;cursor:pointer\" style-hover=\"background:#fafafa\">\n                  <div style=\"{{ k.track }}\"><span style=\"{{ k.knob }}\"><\u002Fspan><\u002Fdiv>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"display:flex;align-items:center;gap:7px;flex-wrap:wrap\">\n                      <span style=\"{{ k.nameStyle }}\">{{ k.name }}<\u002Fspan>\n                      <sc-if value=\"{{ k.auth }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:10.5px;font-weight:600;color:#2f5dff;background:#eef2ff;padding:2px 7px;border-radius:4px;white-space:nowrap\">Verified caller<\u002Fspan><\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div style=\"{{ k.descStyle }}\">{{ k.desc }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border-radius:12px;padding:24px 26px\">\n          <h2 style=\"font-family:'Wix Madefor Display',sans-serif;font-size:18px;font-weight:700;margin:0 0 5px\">Knowledge<\u002Fh2>\n          <p style=\"margin:0 0 16px;font-size:14px;color:#5c5a5a\">What the agent reads before it answers. The same sources are used on every channel.<\u002Fp>\n          <div style=\"border:1px solid #e5e5e5;border-radius:8px\">\n            <sc-for list=\"{{ sources }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"{{ k.rowStyle }}\">\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:13.5px;font-weight:600\">{{ k.name }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#8a8888;margin-top:1px\">{{ k.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"{{ k.statusStyle }}\">{{ k.status }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button style=\"margin-top:14px;background:#fff;border:1px solid #151414;border-radius:8px;padding:8px 18px;font-size:13.5px;font-weight:600;cursor:pointer\" style-hover=\"background:#f8f6f6\">Add knowledge<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabEmail }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border-radius:12px;padding:24px 26px\">\n          <h2 style=\"font-family:'Wix Madefor Display',sans-serif;font-size:18px;font-weight:700;margin:0 0 5px\">Outgoing email settings<\u002Fh2>\n          <p style=\"margin:0 0 22px;font-size:14px;color:#5c5a5a\">Customize the emails you send from Wix Inbox, whether you write them or the agent does. <a style=\"cursor:pointer\">Learn more<\u002Fa><\u002Fp>\n          <div style=\"display:grid;grid-template-columns:minmax(280px,1fr) minmax(240px,340px);gap:34px;align-items:start\">\n            <div>\n              <div style=\"font-size:13.5px;font-weight:600;margin-bottom:7px\">Subject line<\u002Fdiv>\n              <div style=\"border:1px solid #dedede;border-radius:8px;padding:10px 13px;font-size:14px;background:#fafafa;color:#3b3939\">Parky Spa sent you a new message<\u002Fdiv>\n              <div style=\"font-size:13.5px;font-weight:600;margin:20px 0 9px\">Sender identity<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:11px\">\n                <sc-for list=\"{{ senders }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <div sc-camel-on-click=\"{{ o.pick }}\" style=\"display:flex;align-items:center;gap:10px;cursor:pointer\">\n                    <span style=\"{{ o.dotStyle }}\"><\u002Fspan>\n                    <span style=\"font-size:14px\">{{ o.label }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"border:1px solid #dedede;border-radius:8px;padding:10px 13px;font-size:14px;background:#fafafa;color:#3b3939;margin-top:12px\">Rom Lampel<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#f4f3f3;border-radius:10px;padding:20px\">\n              <div style=\"background:#fff;border-radius:8px;padding:18px\">\n                <div style=\"font-family:'Wix Madefor Display',sans-serif;font-size:15px;font-weight:700\">Parky Spa sent you a new message<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:9px;margin-top:14px\">\n                  <span style=\"width:28px;height:28px;border-radius:50%;background:#dbe6ff\"><\u002Fspan>\n                  <span style=\"font-size:13.5px;font-weight:600\">Rom Lampel<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:16px\">\n                  <span style=\"height:8px;width:38%;border-radius:4px;background:#eceaea\"><\u002Fspan>\n                  <span style=\"height:8px;width:82%;border-radius:4px;background:#eceaea\"><\u002Fspan>\n                  <span style=\"height:8px;width:90%;border-radius:4px;background:#eceaea\"><\u002Fspan>\n                  <span style=\"height:8px;width:64%;border-radius:4px;background:#eceaea\"><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabPeople }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border-radius:12px;padding:24px 26px\">\n          <h2 style=\"font-family:'Wix Madefor Display',sans-serif;font-size:18px;font-weight:700;margin:0 0 5px\">Inbox collaborators<\u002Fh2>\n          <p style=\"margin:0 0 18px;font-size:14px;color:#5c5a5a\">Who can see conversations and pick them up from the agent.<\u002Fp>\n          <div style=\"border:1px solid #e5e5e5;border-radius:8px\">\n            <sc-for list=\"{{ people }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"{{ p.rowStyle }}\">\n                <span style=\"{{ p.avStyle }}\">{{ p.initials }}<\u002Fspan>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:13.5px;font-weight:600\">{{ p.name }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#8a8888;margin-top:1px\">{{ p.email }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-size:13px;color:#5c5a5a\">{{ p.role }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabSpam }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border-radius:12px;padding:24px 26px\">\n          <h2 style=\"font-family:'Wix Madefor Display',sans-serif;font-size:18px;font-weight:700;margin:0 0 5px\">Spam detection<\u002Fh2>\n          <p style=\"margin:0 0 18px;font-size:14px;color:#5c5a5a\">Filter junk before it reaches your Inbox, and before the agent spends credits on it.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <sc-for list=\"{{ spamOpts }}\" as=\"o\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ o.toggle }}\" style=\"display:flex;align-items:flex-start;gap:10px;cursor:pointer\">\n                <div style=\"{{ o.track }}\"><span style=\"{{ o.knob }}\"><\u002Fspan><\u002Fdiv>\n                <div style=\"min-width:0\">\n                  <div style=\"font-size:13.5px;font-weight:600\">{{ o.name }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#8a8888;margin-top:1px;line-height:1.45\">{{ o.desc }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n\n  SKILLS = [\n    { id: 'sms', name: 'Text a link', group: 'General', auth: false, read: 'Sends the customer a link to any page on your site.' },\n    { id: 'bookcreate', name: 'Book an appointment', group: 'Bookings', auth: false, read: 'Books the customer into an appointment, class or course.' },\n    { id: 'bookinfo', name: 'Share appointment details', group: 'Bookings', auth: true, read: 'Reads out their upcoming appointments.' },\n    { id: 'bookresched', name: 'Reschedule an appointment', group: 'Bookings', auth: true, read: 'Moves their appointment to a new time.' },\n    { id: 'bookcancel', name: 'Cancel an appointment', group: 'Bookings', auth: true, read: 'Cancels their appointment.' },\n    { id: 'planinfo', name: 'Share plan details', group: 'Pricing Plans', auth: true, read: 'Reads out their sessions left and renewal date.' },\n    { id: 'planmanage', name: 'Renew or pause a plan', group: 'Pricing Plans', auth: true, read: 'Renews or pauses their plan.' },\n    { id: 'orderinfo', name: 'Check order status', group: 'Stores', auth: false, read: 'Reads out an order status, tracking and delivery date.' },\n    { id: 'ordermanage', name: 'Cancel or return an order', group: 'Stores', auth: true, read: 'Cancels their order or starts a return.' },\n    { id: 'leadinfo', name: 'Save a new lead', group: 'Forms', auth: false, read: 'Saves the customer\\u2019s name, contact details and why they got in touch.' },\n    { id: 'formfill', name: 'Fill in a form', group: 'Forms', auth: false, read: 'Fills in one of your forms with their answers.' },\n    { id: 'invoiceinfo', name: 'Send an invoice', group: 'Payments', auth: true, read: 'Emails or texts them a copy of an invoice.' },\n    { id: 'collectpay', name: 'Collect a payment', group: 'Payments', auth: true, read: 'Sends them a link to pay an open invoice.' }\n  ];\n\n  TABS = [\n    { id: 'agent', label: 'AI agent', isNew: true },\n    { id: 'email', label: 'Email template' },\n    { id: 'people', label: 'Inbox collaborators' },\n    { id: 'spam', label: 'Spam detection' }\n  ];\n\n  AGENT_CHANNELS = [\n    { id: 'phone', name: 'Phone', mark: '\\u260e', color: '#4b42c9', bg: '#eceafd' },\n    { id: 'chat', name: 'Wix Smart Chat', mark: '\\u2726', color: '#116dff', bg: '#e8f0fe' },\n    { id: 'whatsapp', name: 'WhatsApp Business', mark: '\\u25cf', color: '#25d366', bg: '#e7f8ee' },\n    { id: 'email', name: 'Email', mark: '@', color: '#5c5a5a', bg: '#f0eeee' }\n  ];\n\n  SOURCES = [\n    { name: 'Site pages', x 3px rgba(21,20,20,.16)' : 'none');\n\n    return {\n      whenOpts: this.WHEN.map(w => ({ label: w.label, style: seg(s.when === w.id), pick: () => this.setState({ when: w.id }) })),\n      whenNote: when.note,\n\n      phoneOpts: this.PHONE_OPTS.map(o => {\n        const on = !!s.opts[o.id];\n        const t = this.toggle(on);\n        return { name: o.name, desc: o.desc, track: t.track, knob: t.knob,\n          toggle: () => this.setState({ opts: Object.assign({}, s.opts, { [o.id]: !on }) }) };\n      }),\n\n      emailChannels: this.EMAIL.map((c, i) => this.row(c, i === this.EMAIL.length - 1)),\n\n      dmChannels: this.DM.map((c, i) => {\n        const base = this.row(c, i === this.DM.length - 1);\n        const on = !!s.on[c.id];\n        const t = this.toggle(on);\n        return Object.assign(base, {\n          track: t.track, knob: t.knob,\n          aiLabel: on ? 'AI agent replies here' : 'AI agent is off for this channel',\n          aiLabelStyle: 'font-size:13px;font-weight:600;color:' + (on ? '#151414' : '#8a8888'),\n          toggleAi: () => this.setState({ on: Object.assign({}, s.on, { [c.id]: !on }) })\n        });\n      })\n    };\n  }\n    settingsVals() {\n    const s = this.state;\n    const lv = s.lv;\n    const setLv = (id, v) => this.setState({ lv: Object.assign({}, lv, { [id]: v }) });\n    const allOn = this.SKILLS.every(k => (lv[k.id] || 'off') !== 'off');\n    const tAgent = this.toggle(s.agentOn, 'lg');\n    const seg = (on) => 'white-space:nowrap;font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 16px;border-radius:16px;cursor:pointer;border:none;background:' + (on ? '#fff' : 'transparent') + ';color:' + (on ? '#151414' : '#5c5a5a') + ';box-shadow:' + (on ? '0 1px 3px rgba(21,20,20,.16)' : 'none');\n    const chip = (on) => 'white-space:nowrap;font-family:inherit;font-size:13px;font-weight:600;padding:7px 15px;border-radius:18px;cursor:pointer;border:1px solid ' + (on ? '#2f5dff' : '#dedede') + ';background:' + (on ? '#eef2ff' : '#fff') + ';color:' + (on ? '#2f5dff' : '#3b3939');\n    const groupNames = [];\n    this.SKILLS.forEach(k => { if (groupNames.indexOf(k.group) < 0) groupNames.push(k.group); });\n\n    return {\n\n      tabs: this.TABS.map(t => ({\n        label: t.label, isNew: !!t.isNew,\n        style: 'display:inline-flex;align-items:center;font-family:inherit;font-size:14px;font-weight:600;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;background:' + (s.tab === t.id ? '#eceaea' : 'transparent') + ';color:#151414',\n        pick: () => this.setState({ tab: t.id })\n      })),\n      tabAgent: s.tab === 'agent', tabEmail: s.tab === 'email', tabPeople: s.tab === 'people', tabSpam: s.tab === 'spam',\n\n      channelDots: this.AGENT_CHANNELS.map((c, i) => ({\n        mark: c.mark,\n        style: 'width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;border:2px solid #fff;margin-left:' + (i ? '-10px' : '0') + ';color:' + c.color + ';background:' + c.bg\n      })),\n\n      agentTrack: tAgent.track, agentKnob: tAgent.knob,\n      toggleAgent: () => this.setState({ agentOn: !s.agentOn }),\n\n      agentChannels: this.AGENT_CHANNELS.map(c => {\n        const on = s.agentOn && !!s.on[c.id];\n        const t = this.toggle(on);\n        return {\n          name: c.name, mark: c.mark, track: t.track, knob: t.knob,\n          state: on ? 'Replies first' : 'You reply',\n          cardStyle: 'display:flex;align-items:center;gap:11px;border:1px solid ' + (on ? '#c9d6ff' : '#e5e5e5') + ';border-radius:10px;padding:12px 13px;cursor:pointer;background:' + (on ? '#f8fbff' : '#fff'),\n          iconStyle: 'width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;color:' + c.color + ';background:' + c.bg,\n          toggle: () => this.setState({ on: Object.assign({}, s.on, { [c.id]: !s.on[c.id] }) })\n        };\n      }),\n\n      voices: ['Female', 'Male', 'Neutral'].map(label => ({ label, style: seg(s.voice === label), pick: () => this.setState({ voice: label }) })),\n      tones: ['Calm', 'Friendly', 'Professional', 'Brief'].map(label => ({ label, style: chip(s.tone === label), pick: () => this.setState({ tone: label }) })),\n      greeting: 'Hi, this is Robin, the assistant at Parky Spa. I can book treatments, check your appointments or take a message. How can I help?',\n      keywords: s.words.map(word => ({ word, remove: () => this.setState({ words: s.words.filter(w => w !== word) }) })),\n\n      turnAllLabel: allOn ? 'Turn off all actions' : 'Turn on all actions',\n      turnAllStyle: 'font-family:inherit;font-size:13px;font-weight:600;background:none;border:none;padding:4px 2px;white-space:nowrap;cursor:pointer;color:#2f5dff',\n      turnAllOn: () => { const n = {}; this.SKILLS.forEach(k => { n[k.id] = allOn ? 'off' : 'read'; }); this.setState({ lv: n }); },\n\n      actGroups: groupNames.map((gn, gi) => {\n        const all = this.SKILLS.filter(k => k.group === gn);\n        const gOn = all.every(k => (lv[k.id] || 'off') !== 'off');\n        return {\n          name: gn,\n          headStyle: 'display:flex;align-items:center;gap:8px;padding:9px 14px;background:#fafafa;' + (gi ? 'border-top:1px solid #e5e5e5' : 'border-radius:7px 7px 0 0'),\n          toggleLabel: gOn ? 'Turn off' : 'Turn on',\n          toggle: (e) => { e.stopPropagation(); const n = Object.assign({}, lv); all.forEach(k => { n[k.id] = gOn ? 'off' : 'read'; }); this.setState({ lv: n }); },\n          items: all.map(k => {\n            const on = (lv[k.id] || 'off') !== 'off';\n            const t = this.toggle(on);\n            return {\n              name: k.name, desc: k.read, auth: !!k.auth, track: t.track, knob: t.knob,\n              nameStyle: 'font-size:13.5px;font-weight:600;color:' + (on ? '#151414' : '#6b6969'),\n              descStyle: 'font-size:12.5px;line-height:1.4;margin-top:1px;color:' + (on ? '#8a8888' : '#a9a7a7'),\n              toggle: () => setLv(k.id, on ? 'off' : 'read')\n            };\n          })\n        };\n      }),\n\n      sources: this.SOURCES.map((k, i) => ({\n        name: k.name, meta: k.meta, status: k.status,\n        rowStyle: 'display:flex;align-items:center;gap:12px;padding:12px 14px' + (i ? ';border-top:1px solid #f3f1f1' : ''),\n        statusStyle: 'font-size:11px;font-weight:600;color:#1a6b3f;background:#e6f4ec;padding:3px 9px;border-radius:4px;white-space:nowrap'\n      })),\n\n      senders: ['Sender name', 'Business or website name', 'Sender name + business name'].map(label => ({\n        label,\n        dotStyle: 'width:16px;height:16px;border-radius:50%;flex-shrink:0;border:' + (s.sender === label ? '5px solid #116dff' : '1.5px solid #c4c2c2'),\n        pick: () => this.setState({ sender: label })\n      })),\n\n      people: this.PEOPLE.map((p, i) => ({\n        name: p.name, email: p.email, role: p.role, initials: p.initials,\n        rowStyle: 'display:flex;align-items:center;gap:12px;padding:13px 14px' + (i ? ';border-top:1px solid #f3f1f1' : ''),\n        avStyle: 'width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:#fff;flex-shrink:0;background:' + ['#f0623c', '#4b42c9', '#1a6b3f'][i % 3]\n      })),\n\n      spamOpts: this.SPAM.map(o => {\n        const on = !!s.spam[o.id];\n        const t = this.toggle(on);\n        return { name: o.name, desc: o.desc, track: t.track, knob: t.knob,\n          toggle: () => this.setState({ spam: Object.assign({}, s.spam, { [o.id]: !on }) }) };\n      })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
