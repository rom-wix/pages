<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alfred — demo</title>
<meta name="description" content="Clickable mockup of Alfred standalone: landing page, onboarding and dashboard. Dummy data, no login.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400;500;600;700;800&family=Wix+Madefor+Text:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* ── Living Signal ─────────────────────────────────────────────────────────
   Concept B (light) from the Alfred brand canvas: paper ground, ink type,
   a violet → cyan → lime signal, lime as the primary action.              */
:root{
  --paper:#F6F7FB; --ink:#151414; --deep:#0B0D17; --white:#fff;
  --violet:#7A5CFF; --cyan:#2ED9FF; --lime:#C9FF3D;
  --warm:#FFB13D; --pink:#FF6BD6;
  --muted:#525150; --line:rgba(0,0,0,.10); --line-2:rgba(0,0,0,.16);
  --lime-tint:#EAF9C8; --lime-mid:#6CB800; --lime-deep:#2B5A00; --lime-line:#B9E36B;
  --night-panel:#141A2B; --night-muted:#A6ADC8;
  --r:10px; --shadow:0 2px 8px rgba(0,0,0,.06); --shadow-lg:0 12px 30px rgba(19,23,32,.10);
  --ease:cubic-bezier(.2,0,0,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--white); color:var(--ink);
  padding-bottom:86px; /* clear the fixed demo bar */
  font-family:'Wix Madefor Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Wix Madefor Display',system-ui,sans-serif;letter-spacing:-.02em;margin:0}
a{color:inherit}
button{font:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── primitives ─────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;
  border-radius:var(--r);border:1px solid transparent;font-size:15px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:filter .12s var(--ease),background .12s var(--ease)}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--lime);color:var(--deep);box-shadow:var(--shadow)}
.btn-primary:hover{filter:brightness(.97)}
.btn-primary[disabled]{opacity:.5;cursor:not-allowed}
.btn-outline{background:var(--white);color:var(--ink);border-color:rgba(0,0,0,.18)}
.btn-outline:hover{background:var(--paper)}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-ghost:hover{background:var(--paper)}
.btn-sm{height:38px;padding:0 14px;font-size:13px}
.btn-lg{height:56px;padding:0 26px;font-size:16px}
.chip{height:44px;padding:0 16px;border-radius:999px;background:var(--white);border:1px solid var(--line-2);
  font-size:14px;font-weight:600;cursor:pointer;transition:background .12s var(--ease)}
.chip:hover{background:var(--paper)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--white);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;
  font-size:12px;font-weight:700;white-space:nowrap}
.pill-live{background:var(--lime-tint);color:var(--lime-deep)}
.pill-live i{width:7px;height:7px;border-radius:999px;background:var(--lime-mid);display:block}
.pill-soon{background:var(--paper);color:var(--muted);border:1px dashed rgba(0,0,0,.25);font-weight:600}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:26px}
.field{display:flex;flex-direction:column;gap:8px}
.field > label{font-size:14px;font-weight:600}
.field .hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=url],textarea,select{
  width:100%;padding:0 14px;height:48px;border-radius:var(--r);background:var(--white);
  border:1px solid var(--line-2);font-family:inherit;font-size:15px;color:var(--ink);outline:0}
textarea{height:auto;padding:14px;line-height:1.5;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(122,92,255,.18)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--violet)}
.muted{color:var(--muted)}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 24px}
section{padding:80px 0}
.sec-paper{background:var(--paper)}
.sec-night{background:var(--deep);color:var(--white)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(28px,3.4vw,44px);line-height:1.05;max-width:640px}
.sec-head p{margin:0;max-width:400px;font-size:16px;color:var(--muted)}
.sec-night .sec-head p{color:var(--night-muted)}
.sec-night .eyebrow{color:var(--lime)}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media(max-width:700px){.g2,.g4{grid-template-columns:1fr}section{padding:56px 0}}

/* ── Alfred (Pebble) ────────────────────────────────────────────────────── */
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes think{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-1.5px)}}
.pebble{animation:breathe 4.2s var(--ease) infinite;transform-origin:50% 52%}
.pebble .halo{animation:spin 18s linear infinite;transform-origin:32px 33px}
.pebble .halo.fast{animation-duration:9s}
.pebble .dot{animation:think 1.6s ease-in-out infinite}
.pebble .dot:nth-child(2){animation-delay:.22s}
.pebble .dot:nth-child(3){animation-delay:.44s}
.wash{position:absolute;border-radius:999px;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,rgba(122,92,255,.22) 0%,rgba(46,217,255,.10) 40%,rgba(246,247,251,0) 70%)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}

/* ── demo chrome ────────────────────────────────────────────────────────── */
#demobar{position:fixed;z-index:100;left:50%;transform:translateX(-50%);bottom:18px;
  display:flex;align-items:center;gap:6px;padding:7px;border-radius:999px;
  background:rgba(11,13,23,.93);backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.28)}
#demobar button{height:34px;padding:0 14px;border:0;border-radius:999px;background:transparent;
  color:#cfd4e6;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
#demobar button:hover{background:rgba(255,255,255,.10);color:#fff}
#demobar button[aria-current="true"]{background:var(--lime);color:var(--deep)}
#demobar .sep{width:1px;height:20px;background:rgba(255,255,255,.18);margin:0 3px}
#demobar .tag{color:#7b83a0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:0 8px}
@media(max-width:640px){#demobar{flex-wrap:wrap;max-width:94vw;justify-content:center;border-radius:18px}}

/* ── landing ────────────────────────────────────────────────────────────── */
.nav{position:sticky;top:0;z-index:20;background:rgba(246,247,251,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:28px;height:72px}
.nav nav{display:flex;gap:26px;font-size:14px;font-weight:500;color:var(--muted)}
.nav nav a{text-decoration:none}
.nav nav a:hover{color:var(--ink)}
.nav .right{margin-left:auto;display:flex;gap:8px;align-items:center}
@media(max-width:860px){.nav nav{display:none}}
.mark{display:inline-flex;align-items:center;gap:10px}
.mark b{font-family:'Wix Madefor Display',sans-serif;font-size:17px;font-weight:700}
.mark span{font-size:12px;font-weight:600;color:var(--muted)}
.hero{display:flex;align-items:center;gap:60px}
.hero-copy{width:560px;flex:0 0 auto;display:flex;flex-direction:column;gap:22px}
.hero h1{font-size:clamp(38px,5vw,64px);line-height:1;letter-spacing:-.025em}
.hero .lede{font-size:19px;line-height:1.55;color:var(--muted);max-width:500px;margin:0}
.hero .assure{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);list-style:none;padding:0;margin:0}
.hero .assure li{display:flex;align-items:center;gap:6px}
.hero-art{position:relative;width:580px;height:600px;flex:0 0 auto}
.hero-art .wash{inset:auto;left:50%;top:50%;width:620px;height:620px;margin:-310px 0 0 -310px}
.hero-art .peb{position:absolute;left:0;top:60px}
.hero-art .callcard{position:absolute;right:0;top:30px;width:400px}
@media(max-width:1180px){
  .hero{flex-direction:column;gap:40px}.hero-copy{width:100%}
  .hero-art{width:100%;height:auto;display:flex;flex-direction:column;align-items:center;gap:28px}
  .hero-art .peb,.hero-art .callcard{position:static}
  .hero-art .callcard{width:100%;max-width:420px}
}
.callcard{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:20px;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:14px}
.bubbles{display:flex;flex-direction:column;gap:10px}
.bub{max-width:92%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.5}
.bub.them{align-self:flex-start;background:var(--paper);border-bottom-left-radius:4px}
.bub.you{align-self:flex-end;background:var(--ink);color:var(--white);border-bottom-right-radius:4px}
.summary{background:var(--paper);border-radius:16px;padding:16px}
.summary .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tags span{background:var(--white);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:600;box-shadow:var(--shadow)}
.step-card{min-height:400px;display:flex;flex-direction:column;gap:18px}
.step-card .n{width:32px;height:32px;border-radius:999px;background:var(--ink);color:var(--white);
  display:grid;place-items:center;font-family:'Wix Madefor Display',sans-serif;font-weight:700;font-size:15px}
.step-card h3{font-size:22px;font-weight:600;letter-spacing:-.01em}
.mini{margin-top:auto;background:var(--paper);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.mini .mf{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:8px;
  background:var(--white);border:1px solid rgba(0,0,0,.14);font-size:14px}
.mini .ml{font-size:12px;font-weight:600;color:var(--muted)}
.tone-mini{display:flex;gap:6px;flex-wrap:wrap}
.tone-mini span{height:32px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;
  font-size:13px;font-weight:600;background:var(--white);border:1px solid rgba(0,0,0,.14)}
.tone-mini span.on{background:var(--ink);color:var(--white);border-color:transparent}
.twoways{display:grid;grid-template-columns:300px minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;
  background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px 28px}
.twoways .col{display:flex;gap:14px;align-items:flex-start;padding-left:28px;border-left:1px solid var(--line)}
@media(max-width:900px){.twoways{grid-template-columns:1fr}.twoways .col{padding-left:0;border-left:0}}
.icobox{width:44px;height:44px;border-radius:12px;background:var(--paper);display:grid;place-items:center;flex:0 0 auto}
.tone-card{background:var(--night-panel);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:24px 22px;
  display:flex;flex-direction:column;gap:16px}
.tone-card .t{display:flex;align-items:center;gap:14px;font-family:'Wix Madefor Display',sans-serif;font-size:20px;font-weight:600}
.tone-card p{margin:0;font-size:15px;line-height:1.5;color:var(--night-muted)}
footer{background:var(--white);border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:center;padding-top:40px;padding-bottom:40px}
footer nav{margin-left:auto;display:flex;gap:24px;font-size:13px;color:var(--muted)}

/* ── onboarding ─────────────────────────────────────────────────────────── */
.onb{display:flex;min-height:calc(100vh - 86px)}
.rail{width:480px;flex:0 0 auto;background:var(--paper);padding:40px 44px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.rail .wash{left:50%;top:46%;width:520px;height:520px;margin:-260px 0 0 -260px}
.rail .mid{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.says{width:100%;background:var(--white);border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:4px;
  padding:18px 20px;box-shadow:var(--shadow)}
.says .who{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--violet)}
.says p{margin:8px 0 0;font-size:17px;line-height:1.5}
.onb main{flex:1;padding:40px 64px;display:flex;flex-direction:column;gap:28px;min-width:0}
.onb h1{font-size:34px;line-height:1.1}
.onb .intro{margin:0;font-size:16px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px;list-style:none;margin:0;padding:0}
.stepper li{display:inline-flex;align-items:center;gap:6px}
.stepper .bead{width:24px;height:24px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:700;
  background:var(--white);border:1px solid var(--line-2);color:var(--muted);cursor:pointer}
.stepper .bead.done{background:var(--lime-tint);border-color:transparent;color:var(--lime-deep)}
.stepper .bead.now{background:var(--ink);border-color:transparent;color:var(--white)}
.stepper .nm{font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.stepper .nm.now{font-weight:700;color:var(--ink)}
.stepper .rule{flex:1;height:1px;background:var(--line);margin:0 4px}
.stepper .rule.done{background:var(--lime-line)}
.onb .foot{margin-top:auto;padding-top:24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.onb .foot .right{display:flex;gap:10px;align-items:center}
.feat{display:flex;gap:14px;align-items:flex-start}
.feat .ic{width:40px;height:40px;border-radius:10px;background:var(--paper);display:grid;place-items:center;flex:0 0 auto}
.feat b{font-size:15px}
.feat p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.channels{display:flex;gap:24px;flex-wrap:wrap;align-items:center;background:var(--paper);border-radius:12px;padding:14px 16px;font-size:14px}
.channels .c{display:flex;align-items:center;gap:8px}
.opt{border:1px solid var(--line-2);background:var(--white);border-radius:16px;padding:16px;text-align:left;cursor:pointer}
.opt:hover{background:var(--paper)}
.opt[aria-pressed="true"]{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet);background:var(--paper)}
.opt b{display:block;font-size:15px}
.opt span{display:block;margin-top:4px;font-size:13px;color:var(--muted);line-height:1.5}
.combo{position:relative;max-width:380px}
.combo .trigger{display:flex;align-items:center;justify-content:space-between;width:100%;height:48px;padding:0 14px;
  border-radius:var(--r);border:1px solid var(--line-2);background:var(--white);cursor:pointer;text-align:left}
.combo .menu{position:absolute;z-index:5;top:54px;left:0;right:0;background:var(--white);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden}
.combo .menu .list{max-height:240px;overflow:auto}
.combo .menu button{display:flex;gap:10px;align-items:baseline;width:100%;padding:9px 14px;border:0;background:none;
  cursor:pointer;text-align:left;font-size:14px}
.combo .menu button:hover{background:var(--paper)}
.numrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line-2);border-radius:12px;padding:12px 16px}
.numrow .n{font-weight:600;font-variant-numeric:tabular-nums}
.banner{display:flex;gap:16px;align-items:center;background:var(--lime-tint);border-radius:16px;padding:20px}
.banner b{color:var(--lime-deep)}
.banner p{margin:2px 0 0;font-size:13px;color:rgba(43,90,0,.8)}
.notice{background:rgba(255,177,61,.15);border-radius:12px;padding:12px 16px;font-size:13px}
@media(max-width:1000px){
  .onb{flex-direction:column}.rail{width:100%;padding:28px}
  .rail .mid{flex-direction:row;gap:20px;padding:16px 0}.rail .mid svg{width:110px;height:110px}
  .onb main{padding:28px}
  .stepper .nm{display:none}
}

/* ── dashboard ──────────────────────────────────────────────────────────── */
.dash{display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 86px)}
.side{position:sticky;top:0;height:calc(100vh - 86px);background:var(--paper);border-right:1px solid var(--line);padding:16px;
  display:flex;flex-direction:column;gap:2px}
.side .brand{padding:6px 6px 20px}
.side a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;text-decoration:none;
  font-size:14px;font-weight:500;color:var(--muted);cursor:pointer}
.side a:hover{background:rgba(0,0,0,.04);color:var(--ink)}
.side a.on{background:rgba(122,92,255,.10);color:var(--violet)}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:8px}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:12px 24px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .biz{font-size:14px}
.top .biz b{display:block}
.dash main{padding:28px 24px 80px;max-width:980px;width:100%;margin:0 auto}
.dash h1{font-size:30px;margin-bottom:4px}
.seg{display:inline-flex;background:var(--paper);border-radius:999px;padding:3px}
.seg button{height:32px;padding:0 16px;border:0;border-radius:999px;background:transparent;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--ink);box-shadow:var(--shadow)}
.kpi{display:flex;gap:6px;align-items:baseline}
.kpi b{font-family:'Wix Madefor Display',sans-serif;font-size:34px;font-weight:700}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;
  padding:0 12px 10px}
td{padding:14px 12px;border-top:1px solid var(--line);vertical-align:top}
tr.clickable:hover td{background:var(--paper);cursor:pointer}
.bar{height:8px;border-radius:999px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:999px}
.sw{width:44px;height:26px;border-radius:999px;background:#ddd;position:relative;border:0;cursor:pointer;flex:0 0 auto}
.sw[aria-checked="true"]{background:var(--lime)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:#fff;
  transition:transform .15s var(--ease)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.row{display:flex;align-items:center;gap:16px;justify-content:space-between}
@media(max-width:900px){.dash{grid-template-columns:1fr}.side{display:none}}
.mobnav{display:none;gap:6px;overflow-x:auto;padding:10px 24px;border-bottom:1px solid var(--line);
  background:var(--white);position:sticky;top:57px;z-index:9;-webkit-overflow-scrolling:touch}
.mobnav button{flex:0 0 auto;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--white);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.mobnav button[aria-current="true"]{background:var(--ink);color:var(--white);border-color:transparent}
@media(max-width:900px){.mobnav{display:flex}}
</style>
</head>
<body>
<div id="app"></div>
<div id="demobar" role="group" aria-label="Demo navigation"></div>
<script>
/* =========================================================================
   Alfred — standalone demo. One file, no build, no network beyond fonts.

let uid = 0;
function pebble(size, state, opts) {
  state = state || 'idle';
  opts = opts || {};
  const id = 'pg' + (++uid);
  const halo = state === 'listening' || state === 'speaking';
  const ring = opts.ring !== undefined ? opts.ring : (!halo && state !== 'idle');
  const ringColor = {thinking:'var(--lime)',happy:'var(--violet)',curious:'var(--lime)',asleep:'var(--violet)'}[state] || 'var(--cyan)';
  const eyeRy = {idle:3,listening:2.6,thinking:3,speaking:2.6,happy:3,curious:3.6,asleep:1.6}[state];
  const ey = state === 'thinking' ? 30 : 32;
  const ex = state === 'thinking' ? 1.5 : 0;
  return `<svg class="pebble" width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--violet)"/><stop offset=".5" stop-color="var(--cyan)"/><stop offset="1" stop-color="var(--lime)"/>
    </linearGradient></defs>
    ${ring ? `<circle cx="32" cy="33" r="27" fill="none" stroke="${ringColor}" stroke-opacity=".3" stroke-width="1.2" stroke-dasharray="2 5"/>` : ''}
    ${halo ? `<g class="halo${state==='speaking'?' fast':''}" stroke="url(#${id})" stroke-width="2" stroke-linecap="round">${
      TICKS.map(t => `<line x1="${t[0]}" y1="${t[1]}" x2="${t[2]}" y2="${t[3]}"/>`).join('')}</g>` : ''}
    ${state === 'thinking' ? `<g fill="var(--lime)"><circle class="dot" cx="46" cy="14" r="1.6"/><circle class="dot" cx="50" cy="10" r="2"/><circle class="dot" cx="55" cy="5" r="2.4"/></g>` : ''}
    <path d="M31 14c11-1 21 7 21 18 0 11-8 21-19 21S12 46 12 33c0-10 9-18 19-19z" fill="url(#${id})"/>
    ${state === 'happy' ? `<g fill="var(--pink)" fill-opacity=".55"><circle cx="22" cy="38" r="2.4"/><circle cx="42" cy="38" r="2.4"/></g>` : ''}
    <ellipse cx="${26+ex}" cy="${ey}" rx="2.2" ry="${eyeRy}" fill="var(--ink)"/>
    <ellipse cx="${38+ex}" cy="${ey}" rx="2.2" ry="${eyeRy}" fill="var(--ink)"/>

          <b>${esc(S.name)} is on duty</b><span class="pill pill-live"><i></i>Live</span></div></div></div>
  </div>
  <div class="twoways">
    <div><div style="font-family:'Wix Madefor Display',sans-serif;font-size:22px;font-weight:600">Two ways he picks up</div>
      <div class="muted" style="font-size:14px">You choose during setup and can switch any time.</div></div>
    <div class="col"><span class="icobox">${ico('contact',20)}</span><div>
      <div style="font-family:'Wix Madefor Display',sans-serif;font-size:18px;font-weight:600">As a receptionist</div>
      <div class="muted" style="font-size:14px">Every call to your number goes straight to ${esc(S.name)}. You get the summary and the transcript.</div></div></div>
    <div class="col"><span class="icobox">${ico('chat',20)}</span><div>
      <div style="font-family:'Wix Madefor Display',sans-serif;font-size:18px;font-weight:600">Like voicemail</div>
      <div class="muted" style="font-size:14px">He picks up only when you’re busy, don’t answer, or have no signal.</div></div></div>
  </div>
</div></section>

<section id="what"><div class="wrap" style="display:flex;flex-direction:column;gap:36px">
  <div class="sec-head"><div><div class="eyebrow">What he does</div><h2>What happens on a call</h2></div>
    <p>Every call ends the same way: a summary, a transcript and a contact in your dashboard.</p></div>
  <div class="grid g4">
    ${doCard('help','Answers questions','Hours, services, prices and directions, from your website and the answers you added.')}
    ${doCard('doc','Takes messages','Name, number and what they need, sent to you the moment the call ends.')}
    ${doCard('meetings','Books meetings','Finds a free slot in your calendar and confirms it with the caller before hanging up.')}
    ${doCard('contact','Keeps the record','A summary and full transcript for every call, and the caller saved as a contact.')}
  </div>
</div></section>

<section class="sec-paper"><div class="wrap" style="display:flex;flex-direction:column;gap:36px">
  <div class="sec-head"><div><div class="eyebrow">Channels</div><h2>One ${esc(S.name)}, wherever your customers reach you</h2></div>
    <p>Phone today. Texts and WhatsApp next, with the same knowledge and the same tone.</p></div>
  <div class="grid g3">
    <div class="card"><div style="display:flex;align-items:center;gap:12px"><span class="icobox">${ico('phone',20)}</span><span class="pill pill-live"><i></i>Live</span></div>
      <div style="font-family:'Wix Madefor Display',sans-serif;font-size:20px;font-weight:600;margin-top:14px">Phone calls</div>
      <p class="muted" style="margin:6px 0 0;font-size:15px">Take a new ${esc(S.name)} number or forward your existing line. He answers around the clock.</p></div>
    <div class="card"><div style="display:flex;align-items:center;gap:12px"><span class="icobox">${ico('chat',20)}</span><span class="pill pill-soon">Coming soon</span></div>
      <div style="font-family:'Wix Madefor Display',sans-serif;font-size:20px;font-weight:600;margin-top:14px">Texts</div>
      <p class="muted" style="margin:6px 0 0;font-size:15px">He will text back missed calls and follow up in writing, with the same knowledge and tone.</p></div>
    <div class="card"><div style="display:flex;align-items:center;gap:12px"><span class="icobox">${ico('whatsapp',20)}</span><span class="pill pill-soon">Coming soon</span></div>
      <div style="font-family:'Wix Madefor Display',sans-serif;font-size:20px;font-weight:600;margin-top:14px">WhatsApp</div>
      <p class="muted" style="margin:6px 0 0;font-size:15px">The same ${esc(S.name)}, in the chat your customers already use.</p></div>
  </div>
</div></section>

<section class="sec-night" id="tone" style="position:relative;overflow:hidden">
  <div class="wash" style="left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;
    background:radial-gradient(circle at 50% 50%,rgba(122,92,255,.35) 0%,rgba(46,217,255,.10) 40%,rgba(11,13,23,0) 70%)"></div>
  <div class="wrap" style="position:relative;display:flex;flex-direction:column;gap:36px">
    <div class="sec-head"><div><div class="eyebrow">Personality</div>
      <h2 style="color:#fff">${esc(S.name)}, the way you’d say it</h2></div>
      <p>Name him, pick his voice, set his tone. He keeps it on every call, and you can change it whenever your business does.</p></div>
    <div class="grid g4">${Object.keys(TONES).map(tone).join('')}</div>
  </div>
</section>

<section><div class="wrap" style="display:flex;flex-direction:column;gap:36px">
  <div class="sec-head"><div><div class="eyebrow">Businesses that hired ${esc(S.name)}</div>
    <h2>At work in clinics, salons, studios and shops</h2></div></div>
  <div class="grid g3">${[0,1,2].map(()=>`<figure class="card" style="margin:0;display:flex;flex-direction:column;gap:20px">
    <blockquote style="margin:0;font-size:15px">[CUSTOMER QUOTE]</blockquote>
    <figcaption style="margin-top:auto;display:flex;align-items:center;gap:12px">
      <span style="width:40px;height:40px;border-radius:999px;background:var(--paper);display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--muted)">[LOGO]</span>
      <span style="font-size:13px"><b style="display:block">[NAME]</b><span class="muted">[BUSINESS, CITY]</span></span>
    </figcaption></figure>`).join('')}</div>
</div></section>

<section class="sec-paper" style="position:relative;overflow:hidden">
  <div class="wash" style="left:50%;top:50%;width:640px;height:640px;margin:-320px 0 0 -320px"></div>
  <div class="wrap" style="position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0">
    ${pebble(120,'happy')}
    <h2 style="font-size:clamp(28px,3.4vw,44px);margin-top:28px">Put ${esc(S.name)} on the line</h2>
    <p class="muted" style="margin:14px 0 0;font-size:17px;max-width:440px">Set up takes a few minutes. No Wix
      account needed. Keep your number.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:28px">
      <button class="btn btn-primary btn-lg" onclick="go('onboarding',{step:0})">Put ${esc(S.name)} on the line ${ico('arrow',18,'var(--deep)')}</button>
      <button class="btn btn-outline btn-lg" onclick="go('onboarding',{step:6})">${ico('play',18)} Listen to a call</button>
    </div>
  </div>
</section>

<footer><div class="wrap">
  <div>${mark(28)}<p class="muted" style="margin:8px 0 0;font-size:13px">The AI receptionist for small businesses.</p></div>
  <nav><a href="#">Help</a><a href="#">Privacy</a><a href="#">Terms</a></nav>
  <div class="muted" style="width:100%;font-size:12px">© 2026 Wix.com, Inc.</div>
</div></footer>`;
}
</script>
<script>
/* ── onboarding ─────────────────────────────────────────────────────────── */
const PEB_BY_STEP = ['listening','curious','speaking','thinking','speaking','curious','happy'];
function saysFor(i) {
  const n = esc(S.name);
  return [
    `Hi, I’m ${n}. I answer your calls when you can’t. Give me a few minutes and I’ll be ready to pick up.`,
    'Which business am I answering for? If you have a website, I’ll read it so I know your hours and services.',
    'This is how I’ll sound. Pick my languages and accent, a voice and a tone, and call me whatever suits your team.',
    S.website ? `I’ve read ${esc(S.website)}. Here’s what I learned. Add anything your site doesn’t say.`
              : 'Without a website I start from scratch. Tell me the things a caller always asks.',
    'Here’s how I’ll greet callers. Change any word, then listen.',
    'Callers need a way to reach me. Pick a number in your country. Next I’ll show you how to send your existing line to it.',
    'Try me before you go live. Call me from your phone, or just chat. Test calls aren’t logged and don’t count.',
  ][i];
}

function stepper() {
  return `<ol class="stepper">${STEPS.map((label,i) => {
    const done = i < S.step, now = i === S.step;
    const bead = done ? ico('check',13,'var(--lime-deep)') : (i+1);
    return `<li><button class="bead ${done?'done':''} ${now?'now':''}" onclick="set({step:${i}})"
        title="Jump to ${label}">${bead}</button>
      <span class="nm ${now?'now':''}" onclick="set({step:${i}})">${label}</span></li>
      ${i < STEPS.length-1 ? `<span class="rule ${done?'done':''}"></span>` : ''}`;
  }).join('')}</ol>`;
}

function shell(opts) {
  const back = S.step > 0
    ? `<button class="btn btn-ghost" onclick="set({step:${S.step-1}})">Back</button>` : '<div></div>';
  const skip = opts.skip === false ? ''
    : `<button class="btn btn-ghost" onclick="set({step:${Math.min(S.step+1,6)}})">${opts.skipLabel||'Skip for now'}</button>`;
  const next = opts.next
    || `<button class="btn btn-primary" onclick="set({step:${S.step+1}})">Continue ${ico('arrow',18,'var(--deep)')}</button>`;
  return `<div class="onb">
    <aside class="rail">
      <div class="wash"></div>
      <div style="position:relative">${mark(28)}</div>
      <div class="mid">${pebble(200, PEB_BY_STEP[S.step])}
        <div class="says"><div class="who">${esc(S.name)}</div><p>${saysFor(S.step)}</p></div></div>
      <div class="muted" style="position:relative;font-size:13px">Step ${S.step+1} of 7</div>
    </aside>
    <main>
      ${stepper()}
      <div><h1>${opts.title}</h1>${opts.intro?`<p class="intro" style="margin-top:8px">${opts.intro}</p>`:''}</div>
      ${opts.body}
      <div class="foot">${back}<div class="right">${skip}${next}</div></div>
    </main>
  </div>`;
}

function viewOnboarding() {
  const n = esc(S.name);
  switch (S.step) {

  case 0: return shell({
    title:'Meet your new receptionist',
    intro:`Here is what ${n} will do for your business from day one. Everything can be changed later.`,
    skip:false,
    next:`<button class="btn btn-primary" onclick="set({step:1})">Let’s get started ${ico('arrow',18,'var(--deep)')}</button>`,
    body:`<div style="display:flex;flex-direction:column;gap:20px;max-width:640px">
      ${[['help','Answers questions','Hours, services, prices and directions, from your website and the answers you add.'],
         ['doc','Takes messages and books meetings','Gets the caller’s name and number, and finds a slot in your calendar when they want one.'],
         ['contact','Sends you the summary','After every call: a summary, the transcript and the caller saved as a contact.']]
        .map(([i,t,b])=>`<div class="feat"><span class="ic">${ico(i,20)}</span><div><b>${t}</b><p>${b}</p></div></div>`).join('')}
      <div class="channels">
        <span class="c">${ico('phone',16)}<b>Phone calls</b><span class="pill pill-live"><i></i>Live</span></span>
        <span class="c muted">${ico('chat',16,'var(--muted)')}Texts <span class="pill pill-soon">Coming soon</span></span>
        <span class="c muted">${ico('whatsapp',16,'var(--muted)')}WhatsApp <span class="pill pill-soon">Coming soon</span></span>
      </div></div>`});

  case 1: return shell({
    title:'Tell me about your business',
    intro:`${n} uses this to introduce your business and to learn what it offers.`,
    skipLabel:'Skip for now',
    body:`<div style="display:flex;flex-direction:column;gap:22px;max-width:560px">
      <div class="field"><label for="biz">Business name</label>
        <input id="biz" type="text" value="${esc(S.business)}" oninput="S.business=this.value">
        <div class="hint">Callers will hear this name in the greeting.</div></div>
      <div class="field"><label for="site">Website</label>
        <input id="site" type="url" value="${esc(S.website)}" placeholder="yourbusiness.com" oninput="S.website=this.value">
        <div class="hint">${n} reads your pages and answers only from what he finds there and what you add.</div></div>
      <a href="#" onclick="event.preventDefault();set({website:'',step:2})"
         style="font-size:14px;font-weight:600;align-self:flex-start">I don’t have a website</a>
    </div>`});

  case 2: return shell({
    title:'Give him a name, a voice and a tone',
    intro:`This is ${n}’s personality. He keeps it on every call, and answers in the caller’s language when it is one you chose.`,
    body:`<div style="display:flex;flex-direction:column;gap:24px;max-width:680px">
      <div class="field"><label for="nm">Name</label>
        <input id="nm" type="text" value="${esc(S.name)}" oninput="S.name=this.value||'Alfred';render()">
        <div class="hint">Callers hear this name. It shows on your dashboard too.</div></div>
      <div><b style="font-size:14px">Languages</b>
        <div class="hint" style="margin:4px 0 10px">Pick all he should speak. He switches when the caller does.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${LANGS.map(l=>
          `<button class="chip" aria-pressed="${S.languages.includes(l.code)}" onclick="toggleLang('${l.code}')">${l.name}</button>`).join('')}</div></div>
      ${S.languages.length ? `<div class="grid g2">${LANGS.filter(l=>S.languages.includes(l.code)).map(l=>
        `<div class="field"><label>${l.name} accent</label>
          <select onchange="S.accents['${l.code}']=this.value">${l.accents.map(a=>
            `<option ${(S.accents[l.code]||l.accents[0])===a?'selected':''}>${a}</option>`).join('')}</select></div>`).join('')}</div>` : ''}
      <div><b style="font-size:14px">Voice</b>
        <div class="grid g3" style="margin-top:10px;gap:10px">${VOICES.map(v=>
          `<button class="opt" aria-pressed="${S.voice===v.id}" onclick="set({voice:'${v.id}'})"><b>${v.name}</b><span>${v.sub}</span></button>`).join('')}</div>
        <div class="hint" style="margin-top:8px">More voices — <b>coming soon</b></div></div>
      <div><b style="font-size:14px">Tone</b>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${Object.keys(TONES).map(t=>
          `<button class="chip" aria-pressed="${S.tone===t}" onclick="set({tone:'${t}',greeting:''})">${t}</button>`).join('')}</div>
        <div class="hint" style="margin-top:8px"><b style="color:var(--ink)">${S.tone}:</b> ${TONES[S.tone].blurb}</div></div>
    </div>`});

  case 3: return shell({
    title: S.website ? 'Here’s what I learned from your site' : 'Teach me about your business',
    intro:'Check it, fix anything that is off, then add the things a website never says.',
    body:`<div style="display:flex;flex-direction:column;gap:22px;max-width:680px">
      ${S.website ? `<div style="display:flex;flex-direction:column;gap:8px">${FACTS.map(([k,v])=>
        `<div style="display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:10px;padding:12px 14px">
          <span style="width:22px;height:22px;border-radius:999px;background:var(--lime-tint);display:grid;place-items:center;flex:0 0 auto">${ico('check',13,'var(--lime-deep)')}</span>
          <b style="width:96px;flex:0 0 auto;font-size:14px">${k}</b>
          <span class="muted" style="flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v}</span>
          <a href="#" onclick="event.preventDefault()" style="font-size:13px;font-weight:600">Edit</a></div>`).join('')}</div>`
        : `<p class="muted" style="margin:0">No website yet — add the facts callers ask about most.</p>`}
      <div>
        <b style="font-size:14px">Add what your site doesn’t say</b>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">${
          ['Cancellation policy','Payment methods','New patient forms','Emergency after hours'].map(p=>
          `<button class="chip btn-sm" style="height:36px" onclick="document.getElementById('fact').value='${p}: ';document.getElementById('fact').focus()">${ico('plus',13,'var(--muted)')} ${p}</button>`).join('')}</div>
        <div style="display:flex;gap:10px"><input id="fact" type="text" placeholder="e.g. Cancellations need 24 hours’ notice"
            onkeydown="if(event.key==='Enter')addFact()">
          <button class="btn btn-outline" onclick="addFact()">Add</button></div>
        ${S.facts.length?`<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">${S.facts.map((f,i)=>
          `<div style="display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:10px;padding:10px 14px;font-size:14px">
            <span style="width:22px;height:22px;border-radius:999px;background:var(--lime-tint);display:grid;place-items:center">${ico('check',13,'var(--lime-deep)')}</span>
            <span style="flex:1">${esc(f)}</span>
            <button class="btn btn-ghost btn-sm" onclick="S.facts.splice(${i},1);render()">Remove</button></div>`).join('')}</div>`:''}
      </div></div>`});

  case 4: return shell({
    title:'How I’ll answer the phone',
    intro:`Drafted from your business name and the ${S.tone} tone you chose.`,
    body:`<div style="display:flex;flex-direction:column;gap:18px;max-width:620px">
      <div class="field"><label for="greet">Greeting</label>
        <textarea id="greet" rows="3" oninput="S.greeting=this.value">${esc(greetingText())}</textarea>
        <div class="hint">Keep it under two sentences so callers can jump in.</div></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-outline" onclick="speak()">${ico('play',17)} Hear it</button>
        <button class="btn btn-ghost" onclick="set({greeting:''})">Write me a new one</button></div>
      <div style="height:1px;background:var(--line)"></div>
      <div class="field"><label for="pz">When you pause ${n}</label>
        <textarea id="pz" rows="3" oninput="S.paused=this.value">${esc(pausedText())}</textarea>
        <div class="hint">Played when you switch ${n} to Paused, for example on holidays.</div></div>
    </div>`});

  case 5: {
    const c = country();
    const opts = c.areas.filter(a => !S.areaQuery ||
      a[0].indexOf(S.areaQuery.trim()) === 0 || a[1].toLowerCase().indexOf(S.areaQuery.trim().toLowerCase()) >= 0);
    const count = `${S.areaQuery.trim()?opts.length+' of ':''}${c.areas.length} area code${c.areas.length===1?'':'s'} in ${c.name}`;
    return shell({
      title:'Where callers reach me',
      intro:'Pick your country and an area code your customers recognize. Forwarding from your existing line comes next.',
      skipLabel:'I’ll do this later',
      next:`<button class="btn btn-primary" ${S.number?'':'disabled'} onclick="set({step:6})">Continue ${ico('arrow',18,'var(--deep)')}</button>`,
      body:`<div style="display:flex;flex-direction:column;gap:22px;max-width:680px">
        <div><b style="font-size:14px">Country</b>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${COUNTRIES.map(x=>
            `<button class="chip" aria-pressed="${x.id===S.country}" onclick="pickCountry('${x.id}')">${x.label}</button>`).join('')}</div></div>
        <div class="field"><label>Area code</label>
          <div class="combo">
            <button class="trigger" onclick="set({areaOpen:${!S.areaOpen},areaQuery:''})">
              <span><b>${S.area}</b> <span class="muted" style="font-size:13px">${areaCity()}</span></span>
              <span style="transform:rotate(90deg);display:inline-flex">${ico('arrow',16,'var(--muted)')}</span></button>
            ${S.areaOpen?`<div class="menu"><div style="padding:8px"><input type="text" autofocus placeholder="Search by code or city"
                value="${esc(S.areaQuery)}" oninput="S.areaQuery=this.value;render();const i=document.querySelector('.combo input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}"></div>
              <div class="list">${opts.length?opts.map(a=>
                `<button onclick="set({area:'${a[0]}',areaOpen:false,areaQuery:''})"><b>${a[0]}</b><span class="muted">${a[1]}</span></button>`).join('')
                :`<div class="muted" style="padding:12px 14px;font-size:13px">No area codes match. Try a city name.</div>`}</div></div>`:''}
          </div>
          <div class="hint">${count}</div></div>
        <div><button class="btn btn-outline" onclick="set({numbersShown:true})">Show me numbers</button></div>
        ${S.number?`<div class="banner" style="padding:14px 18px"><span>${ico('check',16,'var(--lime-deep)')}</span>
            <b style="font-size:14px">${S.number} is yours.</b></div>`
          : (S.numbersShown?`<div><b style="font-size:14px">Pick a number</b>
            <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">${SUFFIX.map(s=>{
              const num = c.fmt(S.area, s);
              return `<div class="numrow"><span class="n">${num}</span><span class="muted" style="font-size:13px">${areaCity()}</span>
                <button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="set({number:'${num}'})">Take it</button></div>`;}).join('')}</div></div>`
          : `<p class="hint" style="margin:0">Pick an area code, then show the numbers available to you.</p>`)}
        ${S.number?'':`<p class="hint" style="margin:0">You can do this later — ${n} just can’t take calls until he has a
          number. Everything else you set up is kept.</p>`}
      </div>`});
  }

  case 6: {
    const ready = `<div class="banner">${pebble(48,'happy')}<div>
      <b style="font-size:15px">${n} is ready to go live</b>
      <p>${S.number?`He will answer ${S.number} as ${esc(S.business)}, ${S.tone} tone.`
        :`He’ll answer as ${esc(S.business)} in a ${S.tone.toLowerCase()} tone — once he has a number to answer on.`}</p></div></div>`;
    return shell({
      title:'Try him, then go live',
      intro: S.number ? `Give ${n} a test call the way a customer would. When it sounds right, switch him on.`
                      : `Chat with ${n} to hear how he answers. He can go on duty now and take calls as soon as he has a number.`,
      skip:false,
      next:`<button class="btn btn-primary" onclick="goLive()">Go live ${ico('arrow',18,'var(--deep)')}</button>`,
      body:`<div style="display:flex;flex-direction:column;gap:18px;max-width:780px">
        <div class="grid g2">
          <div class="card" style="padding:20px"><div style="display:flex;align-items:center;gap:10px">${ico('phone',18)}<b>Call ${n}</b></div>
            ${S.number?`<p class="muted" style="margin:8px 0 0;font-size:13px">Dial his number from your phone and ask what a customer would.</p>
              <div style="margin-top:16px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums">${S.number}</div>`
             :`<p class="muted" style="margin:8px 0 0;font-size:13px">You skipped picking a number, so there’s nothing to call yet.
                Add one from Phone number in your dashboard whenever you’re ready.</p>
               <button class="btn btn-ghost btn-sm" style="margin-top:12px;padding:0" onclick="set({step:5})">Pick a number now</button>`}</div>
          <div class="card" style="padding:20px;display:flex;flex-direction:column">
            <div style="display:flex;align-items:center;gap:10px">${ico('chat',18)}<b>Chat with ${n}</b></div>
            <div class="bubbles" style="margin-top:12px">
              <div class="bub them">${esc(greetingText())}</div>
              ${S.chat.map(m=>`<div class="bub ${m.me?'you':'them'}">${esc(m.text)}</div>`).join('')}</div>
            <div style="display:flex;gap:8px;margin-top:12px">
              <input id="ask" type="text" placeholder="Ask him something" onkeydown="if(event.key==='Enter')ask()">
              <button class="btn btn-outline" onclick="ask()">Send</button></div></div>
        </div>
        ${ready}</div>`});
  }
  }
}

function toggleLang(code) {
  S.languages = S.languages.includes(code) ? S.languages.filter(c=>c!==code) : S.languages.concat([code]);
  render();
}
function pickCountry(id) {
  const c = COUNTRIES.find(x=>x.id===id);
  set({country:id, area:(id==='us'?'854':c.areas[0][0]), areaOpen:false, areaQuery:'', number:'', numbersShown:false});
}
function addFact() {
  const el = document.getElementById('fact');
  if (el && el.value.trim()) { S.facts.push(el.value.trim()); render(); }
}
function speak() {
  try { const u = new SpeechSynthesisUtterance(greetingText()); speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
/* Canned replies — this is a mockup, nothing is sent anywhere. */
const REPLIES = [
  'We’re open Monday to Friday 8 till 6, and Saturday mornings 9 till 1.',
  'A cleaning is usually 45 minutes. I have Tuesday at 10:30 or Thursday at 9:00 — shall I book one?',
  'We’re at 12 Elm Street, Suite 200. There’s a free lot right behind the building.',
  'We take most major plans. I’ll verify yours when you come in — what’s the name on the policy?',
];
function ask() {
  const el = document.getElementById('ask');
  if (!el || !el.value.trim()) return;
  S.chat.push({me:true, text:el.value.trim()});
  S.chat.push({me:false, text:REPLIES[S.chat.length % REPLIES.length]});
  render();
}
function goLive() { set({screen:'dashboard', page:'home', status:'ACTIVE'}); window.scrollTo(0,0); }
</script>
<script>
/* ── dashboard ──────────────────────────────────────────────────────────── */
const NAV = [
  ['home','Home','home'],['settings','Settings','settings'],['phone','Phone number','phone'],
  ['calls','Call log','calls'],['meetings','Meetings','meetings'],['topics','Topics','topics'],
  ['usage','Usage','usage'],['test','Test drive','test'],
];
const statusText = () => ({ACTIVE:'is live',PAUSED:'is paused',OFF:'is off'})[S.status];

function card(title, sub, body, icon) {
  return `<div class="card" style="margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600">
      ${icon?ico(icon,15,'var(--violet)'):''}${title}</div>
    ${sub?`<p class="muted" style="margin:4px 0 0;font-size:13px">${sub}</p>`:''}
    ${body?`<div style="margin-top:16px">${body}</div>`:''}</div>`;
}

function dashPage() {
  const n = esc(S.name);
  switch (S.page) {

  case 'home': return `<h1>Home</h1><p class="muted" style="margin:0 0 20px">Your assistant at a glance.</p>
    ${S.number ? '' : card('No phone number yet',
      `${n} can’t take calls until he has one. Everything else is set up.`,
      `<button class="btn btn-primary btn-sm" onclick="set({page:'phone'})">Get a number</button>`,'phone')}
    <div class="grid g2">
      ${card('Voice &amp; personality','How '+n+' sounds.',
        `<div style="display:flex;gap:24px;flex-wrap:wrap"><div><div class="muted" style="font-size:12px">Assistant</div><b>${n}</b></div>
         <div><div class="muted" style="font-size:12px">Tone</div><b>${S.tone}</b></div>
         <div><div class="muted" style="font-size:12px">Voice</div><b>${VOICES.find(v=>v.id===S.voice).name}</b></div></div>`,'test')}
      ${card('Phone number','Where callers reach '+n+'.',
        S.number?`<div style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums">${S.number}</div>
          <div class="muted" style="font-size:13px;margin-top:4px">Forwarding: ${S.forwardMode==='always'?'every call':'when unavailable'}</div>`
        :`<button class="btn btn-outline btn-sm" onclick="set({page:'phone'})">Get an ${n} number</button>`,'phone')}
      ${card('This month','Calls &amp; minutes.',
        `<div style="display:flex;gap:28px"><div class="kpi"><b>128</b><span class="muted">calls</span></div>
         <div class="kpi"><b>312</b><span class="muted">min</span></div></div>
         <div class="bar" style="margin-top:14px"><i style="width:64%"></i></div>
         <div class="muted" style="font-size:12px;margin-top:6px">64% of your 200-call plan</div>`,'usage')}
      ${card('Recent calls','Latest activity.',
        CALLS.slice(0,3).map(c=>`<div style="display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)">
          <b style="font-size:13px;flex:1">${c.who}</b><span class="muted" style="font-size:12px">${c.t}</span></div>`).join('')
        +`<button class="btn btn-ghost btn-sm" style="padding:0;margin-top:8px" onclick="set({page:'calls'})">See all calls ${ico('arrow',14)}</button>`,'calls')}
    </div>`;

  case 'calls': return `<h1>Call log</h1><p class="muted" style="margin:0 0 20px">Every call, with a summary and transcript.</p>
    <div class="card" style="padding:16px 10px"><div class="tscroll"><table><thead><tr>
      <th>When</th><th>Caller</th><th>Type</th><th>Length</th></tr></thead><tbody>
      ${CALLS.map((c,i)=>`<tr class="clickable" onclick="set({openCall:${S.openCall===i?'null':i}})">
        <td class="muted" style="white-space:nowrap">${c.t}</td>
        <td><b>${c.who}</b><div class="muted" style="font-size:12px">${c.num}</div>
          ${S.openCall===i?`<div style="margin-top:10px;background:var(--paper);border-radius:10px;padding:12px;font-size:13px;white-space:normal">
            <div class="muted" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Summary</div>
            <p style="margin:6px 0 0">${c.sum}</p></div>`:''}</td>
        <td><span class="pill" style="background:var(--paper);color:var(--muted)">${c.type}</span></td>
        <td class="muted" style="font-variant-numeric:tabular-nums">${c.dur}</td></tr>`).join('')}
    </tbody></table></div></div>`;

  case 'meetings': return `<h1>Meetings</h1><p class="muted" style="margin:0 0 20px">Booked by ${n} during calls.</p>
    ${S.scheduling ? `<div class="card" style="padding:16px 10px"><div class="tscroll"><table><thead><tr>
      <th>When</th><th>Who</th><th>What</th><th>Where</th></tr></thead><tbody>
      ${MEETINGS.map(m=>`<tr><td style="white-space:nowrap"><b>${m.when}</b><div class="muted" style="font-size:12px">${m.len}</div></td>
        <td>${m.who}</td><td>${m.what}</td><td class="muted">${m.where}</td></tr>`).join('')}
      </tbody></table></div></div>`
      : card('Meeting scheduling isn’t set up yet','Turn it on and '+n+' can offer real times to callers and book them.',
        `<button class="btn btn-primary btn-sm" onclick="set({scheduling:true})">Turn on scheduling</button>`,'meetings')}`;

  case 'topics': return `<h1>Topics</h1><p class="muted" style="margin:0 0 20px">${n} flags calls that match these.</p>
    ${card('Topics to detect','He can trigger a notification when one comes up.',
      TOPICS.map(t=>`<div class="row" style="padding:12px 0;border-top:1px solid var(--line)">
        <div><b>${t.name}</b><div class="muted" style="font-size:13px">${t.note}</div></div>
        <span class="muted" style="font-size:13px">${t.hits} this month</span></div>`).join('')
      +`<button class="btn btn-outline btn-sm" style="margin-top:14px">${ico('plus',14)} Add a topic</button>`,'topics')}`;

  case 'usage': return `<h1>Usage</h1><p class="muted" style="margin:0 0 20px">Calls and minutes this month.</p>
    ${card('Monthly quota','Calls used vs. your plan.',
      `<div style="display:flex;gap:40px;flex-wrap:wrap"><div class="kpi"><b>128</b><span class="muted">of 200 calls</span></div>
        <div class="kpi"><b>312</b><span class="muted">minutes</span></div>
        <div class="kpi"><b>2:26</b><span class="muted">avg length</span></div></div>
      <div class="bar" style="margin-top:18px"><i style="width:64%"></i></div>
      <div class="muted" style="font-size:12px;margin-top:8px">Resets on 1 October.</div>`,'usage')}
    ${card('Busiest hours','When callers reach out.',
      `<div style="display:flex;align-items:flex-end;gap:6px;height:120px">${
        [12,18,26,34,41,38,30,22,17,25,31,20].map((h,i)=>`<div style="flex:1;text-align:center">
          <div style="background:var(--lime);border-radius:4px;height:${h*2.4}px"></div>
          <div class="muted" style="font-size:10px;margin-top:6px">${8+i}</div></div>`).join('')}</div>`,'usage')}`;

  case 'phone': return `<h1>Phone number</h1><p class="muted" style="margin:0 0 20px">Where callers reach ${n}.</p>
    ${S.number
      ? card('Your '+n+' number','Callers reach him here; forward your business line to it.',
          `<div style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums">${S.number}</div>
           <span class="pill pill-live" style="margin-top:10px"><i></i>Active</span>`,'phone')
      : card('No number yet','Pick one and '+n+' can start taking calls.',
          `<button class="btn btn-primary btn-sm" onclick="go('onboarding',{step:5})">Pick a number</button>`,'phone')}
    ${card('Call forwarding','Forward your existing business line to '+n+'.',
      `<div class="muted" style="font-size:14px">Mode: <b style="color:var(--ink)">${S.forwardMode==='always'?'As a receptionist':'Like voicemail'}</b></div>
       <div style="margin-top:12px;background:var(--paper);border-radius:10px;padding:14px">
        ${forwardSteps(S.number||'your Alfred number', S.forwardMode==='always').steps.map((t,i)=>
          `<div style="display:flex;gap:10px;padding:4px 0;font-size:14px"><b>${i+1}.</b><span>${t}</span></div>`).join('')}
       </div>`,'phone')}`;

  case 'settings': return `<h1>Settings</h1><p class="muted" style="margin:0 0 20px">How ${n} works for your business.</p>
    ${card('Voice &amp; personality','How '+n+' introduces himself and sounds.',
      `<div class="field" style="max-width:420px"><label>Assistant name</label>
        <input type="text" value="${esc(S.name)}" oninput="S.name=this.value||'Alfred';render()"></div>
       <div style="margin-top:16px"><b style="font-size:14px">Tone</b>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${Object.keys(TONES).map(t=>
          `<button class="chip" aria-pressed="${S.tone===t}" onclick="set({tone:'${t}',greeting:''})">${t}</button>`).join('')}</div></div>
       <div class="field" style="margin-top:16px"><label>Greeting</label>
        <textarea rows="2" oninput="S.greeting=this.value">${esc(greetingText())}</textarea></div>`,'test')}
    ${card('Business knowledge','What '+n+' answers callers from.',
      `<div class="field" style="max-width:420px"><label>Website</label>
        <input type="url" value="${esc(S.website)}" oninput="S.website=this.value"></div>
       <div style="margin-top:14px;display:flex;flex-direction:column;gap:6px">${FACTS.map(([k,v])=>
        `<div style="display:flex;gap:12px;font-size:14px;background:var(--paper);border-radius:8px;padding:10px 12px">
          <b style="width:90px;flex:0 0 auto">${k}</b><span class="muted" style="flex:1">${v}</span></div>`).join('')}</div>`,'doc')}
    ${card('Availability &amp; notifications','Paused message and alerts.',
      `<div class="row"><div><b style="font-size:14px">Email me after every call</b>
          <div class="muted" style="font-size:13px">A summary and the transcript.</div></div>
        <button class="sw" role="switch" aria-checked="true" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')==='true'?'false':'true')"></button></div>
       <div class="row" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
        <div><b style="font-size:14px">Let ${n} book meetings</b>
          <div class="muted" style="font-size:13px">He offers real openings and books them for you.</div></div>
        <button class="sw" role="switch" aria-checked="${S.scheduling}" onclick="set({scheduling:${!S.scheduling}})"></button></div>`,'settings')}`;

  case 'test': return `<h1>Test drive</h1><p class="muted" style="margin:0 0 20px">Try ${n} without logging a call.</p>
    <div class="grid g2">
      ${card('Call him',S.number?'Dial his number and ask what a customer would.':'No number yet.',
        S.number?`<div style="font-size:20px;font-weight:700;font-variant-numeric:tabular-nums">${S.number}</div>`
          :`<button class="btn btn-outline btn-sm" onclick="set({page:'phone'})">Get a number</button>`,'phone')}
      ${card('Chat with him','Nothing here is logged or counted.',
        `<div class="bubbles"><div class="bub them">${esc(greetingText())}</div>
          ${S.chat.map(m=>`<div class="bub ${m.me?'you':'them'}">${esc(m.text)}</div>`).join('')}</div>
         <div style="display:flex;gap:8px;margin-top:12px"><input id="ask" type="text" placeholder="Ask him something"
           onkeydown="if(event.key==='Enter')ask()"><button class="btn btn-outline" onclick="ask()">Send</button></div>`,'chat')}
    </div>`;
  }
}

function viewDashboard() {
  const n = esc(S.name);
  return `<div class="dash">
    <aside class="side">
      <div class="brand">${mark(32)}</div>
      ${NAV.map(([id,label,icon])=>`<a class="${S.page===id?'on':''}" onclick="set({page:'${id}',openCall:null})">${ico(icon,18)}${label}</a>`).join('')}
      <div class="foot"><a onclick="go('landing')">${ico('logout',18)}Sign out</a></div>
    </aside>
    <div style="min-width:0">
      <div class="top">
        <div class="biz"><b>${esc(S.business)}</b>
          <span class="muted" style="font-size:12px">${S.number || 'No number yet'}</span></div>
        <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
          <div class="seg">${['ACTIVE','PAUSED','OFF'].map(s=>
            `<button aria-pressed="${S.status===s}" onclick="set({status:'${s}'})">${s[0]+s.slice(1).toLowerCase()}</button>`).join('')}</div>
          <span class="pill ${S.status==='ACTIVE'?'pill-live':''}"
            style="${S.status==='ACTIVE'?'':'background:var(--paper);color:var(--muted)'}">
            ${S.status==='ACTIVE'?'<i></i>':''}${n} ${statusText()}</span>
        </div>
      </div>
      <nav class="mobnav">${NAV.map(([id,label])=>
        `<button aria-current="${S.page===id}" onclick="set({page:'${id}',openCall:null})">${label}</button>`).join('')}</nav>
      <main>${dashPage()}</main>
    </div>
  </div>`;
}

/* ── demo bar + render ──────────────────────────────────────────────────── */
function demobar() {
  const tab = (id,label) => `<button aria-current="${S.screen===id}" onclick="go('${id}')">${label}</button>`;
  const steps = S.screen === 'onboarding'
    ? `<span class="sep"></span><span class="tag">Step</span>` +
      STEPS.map((l,i)=>`<button aria-current="${S.step===i}" onclick="set({step:${i}})" title="${l}">${i+1}</button>`).join('')
    : '';
  return `<span class="tag">Demo</span>${tab('landing','Landing')}${tab('onboarding','Onboarding')}${tab('dashboard','Dashboard')}
    ${steps}<span class="sep"></span><button onclick="reset()" title="Back to the starting state">Reset</button>`;
}
function reset() { S = Object.assign({}, DEFAULTS); render(); window.scrollTo(0,0); }

function render() {
  const app = document.getElementById('app');
  app.innerHTML = S.screen === 'landing' ? viewLanding()
                : S.screen === 'onboarding' ? viewOnboarding()
                : viewDashboard();
  document.getElementById('demobar').innerHTML = demobar();
  document.title = 'Alfred — ' + S.screen + ' demo';
}
render();
</script>
</body>
</html>
